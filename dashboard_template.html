<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RSGx PMO Dashboard | SiteSense</title>
<style>
  /* Neutrals are tinted toward the RSGx red hue (~27) rather than pure grey,
     so the whole surface reads as one family. No pure black or white anywhere. */
  :root {
    color-scheme: light;
    --surface:        oklch(99.2% 0.002 27);
    --surface-sunk:   oklch(97.2% 0.004 27);
    --surface-raised: oklch(100% 0 0 / 0);
    --ink:            oklch(19% 0.008 27);
    --ink-2:          oklch(43% 0.008 27);
    --ink-3:          oklch(53% 0.008 27); /* 53% clears 4.5:1 AA on the light surface for the small labels this ink carries */
    --rule:           oklch(91% 0.005 27);
    --rule-strong:    oklch(84% 0.006 27);
    --accent:         oklch(54% 0.216 27);
    --accent-sunk:    oklch(96% 0.021 27);

    --s1: oklch(55% 0.16 255); --s2: oklch(66% 0.17 45);  --s3: oklch(66% 0.13 165);
    --s4: oklch(74% 0.15 85);  --s5: oklch(72% 0.12 355); --s6: oklch(52% 0.15 145);
    --s7: oklch(42% 0.17 285); --s8: oklch(62% 0.19 25);

    --ok:    oklch(58% 0.16 145);
    --warn:  oklch(78% 0.16 85);
    --alert: oklch(56% 0.19 25);

    --step-1: 11px; --step0: 13px; --step1: 16.5px; --step2: 21px; --step3: 27px;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --surface:      oklch(17.5% 0.006 27);
      --surface-sunk: oklch(21% 0.007 27);
      --ink:          oklch(97% 0.003 27);
      --ink-2:        oklch(78% 0.006 27);
      --ink-3:        oklch(63% 0.007 27);
      --rule:         oklch(28% 0.008 27);
      --rule-strong:  oklch(36% 0.009 27);
      --accent:       oklch(66% 0.19 27);
      --accent-sunk:  oklch(26% 0.05 27);
      --s1: oklch(64% 0.16 255); --s2: oklch(62% 0.17 45);  --s3: oklch(62% 0.12 165);
      --s4: oklch(66% 0.14 85);  --s5: oklch(64% 0.14 355); --s6: oklch(58% 0.15 145);
      --s7: oklch(68% 0.15 285); --s8: oklch(66% 0.18 25);
      --ok:    oklch(66% 0.16 145);
      --warn:  oklch(76% 0.15 85);
      --alert: oklch(66% 0.19 25);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface:      oklch(17.5% 0.006 27);
    --surface-sunk: oklch(21% 0.007 27);
    --ink:          oklch(97% 0.003 27);
    --ink-2:        oklch(78% 0.006 27);
    --ink-3:        oklch(63% 0.007 27);
    --rule:         oklch(28% 0.008 27);
    --rule-strong:  oklch(36% 0.009 27);
    --accent:       oklch(66% 0.19 27);
    --accent-sunk:  oklch(26% 0.05 27);
    --s1: oklch(64% 0.16 255); --s2: oklch(62% 0.17 45);  --s3: oklch(62% 0.12 165);
    --s4: oklch(66% 0.14 85);  --s5: oklch(64% 0.14 355); --s6: oklch(58% 0.15 145);
    --s7: oklch(68% 0.15 285); --s8: oklch(66% 0.18 25);
    --ok:    oklch(66% 0.16 145);
    --warn:  oklch(76% 0.15 85);
    --alert: oklch(66% 0.19 25);
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--surface);
    color: var(--ink);
    font: var(--step0)/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  h1, h2, h3 { margin: 0; font-weight: 620; letter-spacing: -0.011em; }

  /* ---------- masthead ---------- */
  .masthead {
    display: flex; align-items: baseline; justify-content: space-between; gap: 16px;
    flex-wrap: wrap;
    padding: 18px 28px 14px;
    border-bottom: 1px solid var(--rule);
  }
  .wordmark { display: flex; align-items: baseline; gap: 10px; }
  .wordmark .rule { width: 22px; height: 3px; background: var(--accent); border-radius: 2px;
                    transform: translateY(-4px); }
  .wordmark h1 { font-size: var(--step1); }
  .wordmark span { color: var(--ink-3); font-size: var(--step0); }
  .stamp { color: var(--ink-3); font-size: var(--step-1); font-variant-numeric: tabular-nums; }
  .refresh-group { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .refresh-btn { padding: 6px 12px; min-height: 30px; font-size: var(--step-1); }
  .refresh-btn[disabled] { opacity: 0.55; cursor: default; }
  .refresh-status { font-size: var(--step-1); color: var(--ink-3); display: inline-flex; align-items: center; gap: 6px; }
  .refresh-status.is-running .dot::before { animation: pulse 1.1s ease-in-out infinite; }
  .refresh-status.is-error { color: var(--alert); }
  .refresh-status.is-done { color: var(--ok); }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  @media (prefers-reduced-motion: reduce) { .refresh-status.is-running .dot::before { animation: none; } }

  /* ---------- tabs ---------- */
  .tabstrip {
    display: flex; gap: 2px; padding: 0 20px; overflow-x: auto;
    border-bottom: 1px solid var(--rule); scrollbar-width: thin;
  }
  .tabstrip button {
    flex: none; appearance: none; background: none; border: 0;
    padding: 11px 13px 9px; margin-bottom: -1px;
    font: 590 var(--step0)/1 system-ui, sans-serif; color: var(--ink-3);
    border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap;
    transition: color 160ms var(--ease);
  }
  .tabstrip button:hover { color: var(--ink); }
  .tabstrip button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
  /* The configuration tab is pushed right and set apart: it changes settings
     rather than showing data, so it should not read as another view. */
  .tabstrip button[data-config="true"] { margin-left: auto; color: var(--ink-3); }
  .tabstrip button[data-config="true"] ~ button[data-config="true"] { margin-left: 0; }
  .tabstrip button[data-config="true"]::before { content: "⚙"; margin-right: 6px; font-size: 12px; }

  select.region-pick, input.deliv-pick {
    appearance: auto; font: var(--step0) system-ui, sans-serif; color: var(--ink);
    background: var(--surface); border: 1px solid var(--rule-strong);
    border-radius: 5px; padding: 3px 6px;
  }
  /* A derived default reads quieter than a date someone typed in. */
  input.deliv-default { color: var(--ink-2); border-style: dashed; }

  main { padding: 20px 28px 72px; }
  .lede { color: var(--ink-2); max-width: 68ch; margin: 0 0 20px; }

  /* ---------- filter rail ---------- */
  .rail {
    display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 14px;
    padding: 12px 14px; margin-bottom: 18px;
    background: var(--surface-sunk); border: 1px solid var(--rule); border-radius: 9px;
  }
  .field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .field > label {
    font-size: var(--step-1); font-weight: 600; letter-spacing: 0.03em;
    text-transform: uppercase; color: var(--ink-3);
  }
  /* Text inputs and selects only. Checkboxes live inside .field via the project
     picker and must keep their native box, not inherit field sizing. */
  .field input:not([type="checkbox"]), .field select {
    appearance: none; font: var(--step0) system-ui, sans-serif; color: var(--ink);
    background: var(--surface); border: 1px solid var(--rule-strong); border-radius: 6px;
    padding: 6px 9px; min-height: 32px;
    /* Selects otherwise stretch to their longest option, which blows the rail
       out to several rows once cost codes and locations are in play. */
    max-width: 230px; text-overflow: ellipsis;
  }
  .field select { padding-right: 26px;
    background-image: linear-gradient(45deg, transparent 50%, currentColor 50%),
                      linear-gradient(135deg, currentColor 50%, transparent 50%);
    background-position: calc(100% - 14px) 14px, calc(100% - 9px) 14px;
    background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; }
  .field input:focus-visible, .field select:focus-visible, button:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 1px;
  }
  .field input[type="search"] { min-width: 230px; }
  .rail .spacer { flex: 1 1 auto; }
  .btn {
    appearance: none; font: 590 var(--step0) system-ui, sans-serif; cursor: pointer;
    background: var(--surface); color: var(--ink);
    border: 1px solid var(--rule-strong); border-radius: 6px; padding: 7px 12px; min-height: 32px;
  }
  .btn:hover { border-color: var(--ink-3); }
  .btn-quiet { background: none; border-color: transparent; color: var(--ink-2); }
  .btn-quiet:hover { color: var(--ink); border-color: var(--rule-strong); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: oklch(99% 0 0); }
  .btn-primary:hover { border-color: var(--accent); filter: brightness(1.06); }
  .btn-danger { color: var(--alert); }
  .btn-danger:hover { color: var(--alert); border-color: var(--alert); }

  /* ---------- signed-in user, password dialog, toast (server only) ---------- */
  .user-box { display: inline-flex; align-items: center; gap: 4px; padding-left: 10px;
              margin-left: 2px; border-left: 1px solid var(--rule); }
  .user-box form { margin: 0; }
  .user-box .btn { padding: 5px 9px; min-height: 30px; font-size: var(--step-1); }
  .user-name { font-size: var(--step-1); font-weight: 600; color: var(--ink); margin-right: 4px; }
  .user-role { font-weight: 600; font-size: 10px; letter-spacing: 0.04em; text-transform: uppercase;
               color: var(--ink-3); border: 1px solid var(--rule-strong); border-radius: 999px;
               padding: 1px 6px; margin-left: 4px; }
  .pw-dialog { border: 1px solid var(--rule-strong); border-radius: 10px; padding: 22px 22px 18px;
               background: var(--surface); color: var(--ink); width: min(380px, calc(100vw - 32px)); }
  .pw-dialog::backdrop { background: oklch(0% 0 0 / 0.35); }
  .pw-dialog h3 { font-size: var(--step1); margin-bottom: 14px; }
  .pw-dialog .field { margin-bottom: 12px; }
  .pw-dialog .field input { max-width: none; width: 100%; }
  .pw-dialog .hint { color: var(--ink-3); font-size: var(--step-1); margin: 0 0 8px; }
  .pw-error { color: var(--alert); font-size: var(--step-1); min-height: 1.2em; margin: 0 0 8px; }
  .pw-actions { display: flex; justify-content: flex-end; gap: 8px; }
  .toast { position: fixed; z-index: 70; left: 50%; bottom: 22px; transform: translate(-50%, 12px);
           opacity: 0; pointer-events: none; transition: opacity 160ms var(--ease), transform 160ms var(--ease);
           background: var(--ink); color: var(--surface); padding: 8px 14px; border-radius: 7px;
           font-size: var(--step0); max-width: calc(100vw - 32px); }
  .toast.is-shown { opacity: 1; transform: translate(-50%, 0); }
  .toast.is-error { background: var(--alert); color: oklch(99% 0 0); }

  /* ---------- users tab ---------- */
  .user-add .rail { margin-bottom: 10px; }
  .nu-projects { margin-bottom: 4px; }
  .nu-projects .hint, .user-edit .hint { color: var(--ink-3); font-size: var(--step-1); margin: 0 0 6px; }
  .user-projects { border: 1px solid var(--rule); border-radius: 9px; background: var(--surface); }
  .user-projects-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 8px 10px;
                       border-bottom: 1px solid var(--rule); }
  .user-projects-bar input { font: var(--step0) system-ui, sans-serif; color: var(--ink); background: var(--surface);
                             border: 1px solid var(--rule-strong); border-radius: 6px; padding: 5px 8px;
                             min-width: 0; flex: 1 1 200px; }
  .user-projects-bar .btn { padding: 4px 9px; min-height: 28px; font-size: var(--step-1); }
  .user-projects-count { color: var(--ink-3); font-size: var(--step-1); margin-left: auto; }
  .user-projects-list { max-height: 260px; overflow-y: auto; padding: 6px 6px 8px;
                        display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 0 8px; }
  .user-projects-list label { display: flex; gap: 8px; align-items: flex-start; padding: 5px 6px;
                              border-radius: 5px; cursor: pointer; line-height: 1.35; font-size: var(--step0); }
  .user-projects-list label:hover { background: var(--surface-sunk); }
  .user-projects-list input { accent-color: var(--accent); margin-top: 2px; flex: none; }
  .user-actions { white-space: nowrap; text-align: right; }
  .user-list td:nth-child(3) .clip { max-width: 30ch; }
  .user-actions .btn { padding: 4px 9px; min-height: 28px; font-size: var(--step-1); }
  .user-edit td { background: var(--surface-sunk); }
  .user-edit-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 10px; }
  .user-secret { max-width: none; margin-bottom: 20px; }
  .user-secret code { display: inline-block; margin-top: 8px; padding: 6px 10px; border-radius: 6px;
                      background: var(--surface); border: 1px solid var(--rule-strong);
                      font: 600 var(--step1) ui-monospace, Consolas, monospace; letter-spacing: 0.03em;
                      user-select: all; }

  /* project picker */
  .picker { position: relative; }
  .picker-pop {
    position: absolute; z-index: 40; top: calc(100% + 6px); left: 0; width: min(400px, 88vw);
    display: none; flex-direction: column; max-height: 380px;
    background: var(--surface); border: 1px solid var(--rule-strong); border-radius: 9px;
    box-shadow: 0 10px 30px oklch(0% 0 0 / 0.16); padding: 10px;
  }
  .picker-pop[data-open="true"] { display: flex; }
  /* max-width comes from the shared field rule and must be released here so the
     search box fills the popover rather than stopping at the rail control width. */
  .picker-pop input[type="search"] { width: 100%; max-width: none; margin-bottom: 8px; }
  .picker-actions { display: flex; gap: 6px; margin-bottom: 8px; }
  .picker-list { overflow-y: auto; flex: 1; margin: 0 -4px; }
  .picker-list label {
    display: flex; gap: 9px; align-items: flex-start; padding: 5px 6px; border-radius: 5px;
    cursor: pointer; line-height: 1.35;
  }
  .picker-list label:hover { background: var(--surface-sunk); }
  .picker-list input[type="checkbox"] {
    flex: none; width: 14px; height: 14px; min-height: 0; margin: 2px 0 0;
    padding: 0; max-width: none; accent-color: var(--accent); appearance: auto;
  }

  /* ---------- stat strip (deliberately not a grid of cards) ---------- */
  /* Grid rather than flex so the cells stay equal and a trailing metric never
     ends up stranded alone on a second row. The 1px gap over a ruled background
     draws the dividers, which keeps them correct in both axes when it wraps. */
  .strip {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(132px, 1fr));
    gap: 1px; margin-bottom: 22px; background: var(--rule);
    border: 1px solid var(--rule); border-radius: 9px; overflow: hidden;
  }
  .strip > div { background: var(--surface); padding: 11px 15px 12px; }
  .strip dt {
    font-size: var(--step-1); font-weight: 600; letter-spacing: 0.03em;
    text-transform: uppercase; color: var(--ink-3); margin-bottom: 3px;
  }
  .strip dd {
    margin: 0; font-size: var(--step2); font-weight: 640; letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums; line-height: 1.15;
  }
  .strip dd small { font-size: var(--step-1); font-weight: 500; color: var(--ink-3); margin-left: 4px; }
  .strip dd.flag-alert { color: var(--alert); }

  /* ---------- blocks ---------- */
  .block { margin-bottom: 26px; }
  .block > h3 { font-size: var(--step0); margin-bottom: 3px; }
  .block > .hint { color: var(--ink-3); font-size: var(--step-1); margin: 0 0 11px; }
  /* Reserve two lines so a one-line hint next to a two-line one still leaves both
     charts starting on the same baseline. */
  .split .block > .hint { min-height: 2.6em; }
  /* Equal columns keep both charts at the same scale factor. An uneven split
     shrinks the narrower chart's text below a readable size once the SVG is
     scaled down to fit. */
  .split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 26px; }
  @media (max-width: 940px) { .split { grid-template-columns: minmax(0, 1fr); } }

  .notice {
    padding: 12px 14px; border: 1px solid var(--rule); border-radius: 8px;
    background: var(--surface-sunk); color: var(--ink-2); max-width: 74ch;
  }
  .notice strong { color: var(--ink); }
  .notes { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 22px; align-items: start; }
  .notes .notice { max-width: none; margin: 0 !important; }
  @media (max-width: 940px) { .notes { grid-template-columns: 1fr; } }
  /* Long-form caveats collapse so they do not out-weigh the table they describe,
     while the headline stays visible. */
  details.notice { padding: 0; }
  details.notice > summary {
    cursor: pointer; padding: 12px 14px; list-style: none; color: var(--ink);
    display: flex; gap: 8px; align-items: baseline;
  }
  details.notice > summary::-webkit-details-marker { display: none; }
  details.notice > summary::before {
    content: "▸"; color: var(--ink-3); font-size: 11px; transition: transform 140ms var(--ease);
  }
  details.notice[open] > summary::before { transform: rotate(90deg); }
  details.notice > div { padding: 0 14px 12px 30px; }

  /* ---------- charts ---------- */
  /* Drawn at the host's exact pixel width (see responsiveChart), so shown 1:1,
     never stretched - stretching is what scaled chart text away from the page's. */
  .chart-host { width: 100%; min-width: 0; }
  svg.chart { display: block; max-width: 100%; overflow: visible; }
  .tick { fill: var(--ink-3); font-size: 10px; }
  .grid { stroke: var(--rule); }
  /* Whole-row hit target sits above the mark so the label and value are clickable
     too, giving a target far larger than the bar itself. */
  .hit { fill: transparent; cursor: pointer; }
  .hit:hover ~ *, .chart g.row:hover .bar { opacity: 1; }
  .chart g.row .bar { transition: opacity 140ms var(--ease); }
  .chart g.row:hover .bar { opacity: 0.74; }
  .chart g.row:hover .rowlabel { fill: var(--ink); }
  .hit:focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; }
  .chart .pt-hit { fill: transparent; cursor: pointer; }
  .chart .pt-hit:hover + .pt, .chart .pt-hit:focus-visible + .pt { r: 6; }
  .pickhint { color: var(--ink-3); font-size: var(--step-1); margin: 0 0 9px; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 14px; }
  .chip {
    display: inline-flex; align-items: center; gap: 7px; padding: 4px 6px 4px 10px;
    border: 1px solid var(--rule-strong); border-radius: 999px; background: var(--accent-sunk);
    font-size: var(--step-1); color: var(--ink);
  }
  .chip button {
    appearance: none; border: 0; background: none; cursor: pointer; color: var(--ink-2);
    font-size: 14px; line-height: 1; padding: 0 3px; border-radius: 50%;
  }
  .chip button:hover { color: var(--accent); }
  .key { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-bottom: 9px;
         font-size: var(--step-1); color: var(--ink-2); }
  .key i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; margin-right: 5px; }

  .tip {
    position: fixed; z-index: 60; pointer-events: none; display: none;
    background: var(--ink); color: var(--surface); font-size: var(--step-1); line-height: 1.4;
    padding: 6px 9px; border-radius: 6px; max-width: 320px;
  }

  /* ---------- tables ---------- */
  .tablewrap { border: 1px solid var(--rule); border-radius: 9px; overflow: hidden; }
  /* A bounded scroll box gives the table a stable footprint next to the charts
     and makes the sticky header actually stick, instead of the table running on
     for fifty rows and dwarfing everything above it. */
  .tablescroll { overflow: auto; max-height: min(58vh, 560px); overscroll-behavior: contain; }
  table { width: 100%; border-collapse: collapse; font-size: var(--step0); }
  thead th {
    position: sticky; top: 0; z-index: 1; text-align: left;
    background: var(--surface-sunk); color: var(--ink-2);
    font-size: var(--step-1); font-weight: 620; letter-spacing: 0.02em;
    padding: 7px 10px 8px; border-bottom: 1px solid var(--rule-strong);
    vertical-align: top;
  }
  .th-label { cursor: pointer; user-select: none; white-space: nowrap; padding-bottom: 5px; }
  .th-label:hover { color: var(--ink); }
  .th-label .dir { color: var(--accent); }
  .th-filter {
    display: block; width: 100%; max-width: 220px; box-sizing: border-box; font-family: inherit;
    font-size: var(--step-1); font-weight: 400; letter-spacing: normal;
    padding: 3px 6px; border: 1px solid var(--rule); border-radius: 5px;
    background-color: var(--surface); color: var(--ink); text-overflow: ellipsis;
  }
  .th-filter::placeholder { color: var(--ink-3); }
  /* Only the dropdown form needs a custom arrow; the search-box fallback for
     high-cardinality columns (e.g. Material, with tens of thousands of
     distinct names - too many for a usable <select>) stays a plain text box. */
  select.th-filter {
    appearance: none; padding-right: 20px;
    background-image: linear-gradient(45deg, transparent 50%, currentColor 50%),
                      linear-gradient(135deg, currentColor 50%, transparent 50%);
    background-position: calc(100% - 12px) 9px, calc(100% - 7px) 9px;
    background-size: 5px 5px, 5px 5px; background-repeat: no-repeat;
  }
  tbody td { padding: 7px 12px; border-bottom: 1px solid var(--rule); vertical-align: top; }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr:hover { background: var(--surface-sunk); }
  .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .clip { display: block; max-width: 34ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .clip-wide { max-width: 46ch; }
  .sub { display: block; color: var(--ink-3); font-size: var(--step-1); }
  .zero { color: var(--ink-3); }
  .short { color: var(--alert); font-weight: 600; }

  .dot { display: inline-flex; align-items: baseline; gap: 6px; white-space: nowrap; }
  .dot::before {
    content: ""; width: 7px; height: 7px; border-radius: 50%; flex: none;
    transform: translateY(-1px); background: var(--ink-3);
  }
  .dot-ok::before    { background: var(--ok); }
  .dot-warn::before  { background: var(--warn); }
  .dot-alert::before { background: var(--alert); }

  .tfoot {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    flex-wrap: wrap; padding: 9px 12px; border-top: 1px solid var(--rule);
    background: var(--surface-sunk); color: var(--ink-2); font-size: var(--step-1);
  }
  .tfoot .pages { display: flex; align-items: center; gap: 6px; }
  .tfoot button { padding: 4px 10px; min-height: 26px; }
  .tfoot button[disabled] { opacity: 0.4; cursor: default; }
  .tfoot button[disabled]:hover { border-color: var(--rule-strong); }
  .btn-export { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .btn-export:hover { background: var(--accent-sunk); border-color: var(--accent); }
  .btn-export::before { content: "\2913"; margin-right: 6px; }

  .empty { padding: 26px 14px; text-align: center; color: var(--ink-3); }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<header class="masthead">
  <div class="wordmark">
    <span class="rule" aria-hidden="true"></span>
    <h1>RSGx PMO Dashboard</h1>
    <span>SiteSense</span>
  </div>
  <div class="refresh-group">
    <p class="stamp" id="stamp"></p>
    <span class="refresh-status" id="refreshStatus"></span>
    <button class="btn refresh-btn" id="refreshBtn" type="button" title="Pulls fresh data from SiteSense now, instead of waiting for the next scheduled run">Refresh data</button>
    <span class="user-box" id="userBox" hidden></span>
  </div>
</header>

<dialog id="pwDialog" class="pw-dialog" aria-labelledby="pwTitle">
  <form method="dialog" id="pwForm">
    <h3 id="pwTitle">Change your password</h3>
    <div class="field"><label for="pwCurrent">Current password</label>
      <input id="pwCurrent" type="password" autocomplete="current-password" required></div>
    <div class="field"><label for="pwNew">New password</label>
      <input id="pwNew" type="password" autocomplete="new-password" minlength="10" required></div>
    <div class="field"><label for="pwConfirm">Confirm new password</label>
      <input id="pwConfirm" type="password" autocomplete="new-password" minlength="10" required></div>
    <p class="hint">At least 10 characters. A few random words make a strong, memorable password.</p>
    <p class="pw-error" id="pwError" role="alert"></p>
    <div class="pw-actions">
      <button type="button" class="btn btn-quiet" id="pwCancel">Cancel</button>
      <button type="submit" class="btn btn-primary">Change password</button>
    </div>
  </form>
</dialog>

<nav class="tabstrip" id="tabstrip" role="tablist"></nav>
<main id="stage"></main>
<div class="tip" id="tip" role="status"></div>

<script>
/*__SITESENSE_DATA__*/

const D = SITESENSE_DATA;

/* Served by server.py (Railway) the page is told who is signed in; opened
   straight off disk (the local workflow) there is no server and no accounts,
   so everything behaves exactly as before and the local user has full rights. */
const SERVER = typeof SERVER_CONTEXT !== 'undefined' ? SERVER_CONTEXT : null;
const IS_ADMIN = !SERVER || SERVER.role === 'admin';

// Same-origin JSON call to server.py. The custom header is what server.py's
// CSRF check looks for; only sent in server mode, where it is same-origin.
async function api(method, path, body) {
  const res = await fetch(path, {
    method, headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'dashboard' },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  let out = {};
  try { out = await res.json(); } catch (e) { /* empty body */ }
  if (!res.ok) throw new Error(out.error || `Request failed (${res.status})`);
  return out;
}

function toast(message, kind) {
  let box = document.getElementById('toast');
  if (!box) { box = el('<div id="toast" class="toast" role="status"></div>'); document.body.appendChild(box); }
  box.textContent = message;
  box.className = 'toast is-shown' + (kind ? ' is-' + kind : '');
  clearTimeout(box._t);
  box._t = setTimeout(() => { box.className = 'toast'; }, 3200);
}

const STR = D.strings;
const S = i => STR[i] || '';
const PROJ = D.projects.map(p => p.name);

// What to say when a whole tab has no rows. Locally that usually means the pull
// predates the feature; on the server a viewer's projects may simply have none.
function emptyNotice(what) {
  if (!SERVER) return el(`<p class="notice">No ${what} in this dataset. Re-run <code>fetch_data.py</code> to pull it.</p>`);
  const scope = !IS_ADMIN ? (PROJ.length === 1 ? 'your project' : 'any of your projects') : 'any project';
  return el(`<p class="notice">No ${what} recorded in SiteSense for ${scope}.</p>`);
}

// materials: [nameIdx, descIdx, uomIdx, typeIdx, guidIdx]
const matName = m => S(D.materials[m][0]);
const matDesc = m => S(D.materials[m][1]);
const matUom  = m => S(D.materials[m][2]);
const matType = m => S(D.materials[m][3]);
const matGuid = m => S(D.materials[m][4]);

/* ---------------------------------------------------------------- regions
   Region is not a SiteSense field. It is an RSGx overlay kept in regions.json,
   baked in by the refresh script. Edits made on the Regions page are held in
   this browser straight away; downloading regions.json back into the project
   folder is what makes them outlast the next refresh. */
const REGION_KEY = 'rsgx.sitesense.regions.v1';
const REGION_CHOICES = ['East', 'West'];

const regionByProject = (() => {
  const map = D.projects.map(p => p.region || '');
  // On the server the regions in the page are already the shared, current
  // ones; a browser's own saved copy would only ever be stale there.
  if (SERVER) return map;
  try {
    const saved = JSON.parse(localStorage.getItem(REGION_KEY) || '{}');
    D.projects.forEach((p, i) => {
      if (Object.prototype.hasOwnProperty.call(saved, String(p.id))) map[i] = saved[String(p.id)] || '';
    });
  } catch (e) { /* unreadable or blocked storage: fall back to the baked values */ }
  return map;
})();
const regionOf = i => regionByProject[i] || '';

function saveRegions() {
  const out = {};
  D.projects.forEach((p, i) => { out[String(p.id)] = regionOf(i); });
  if (SERVER) {
    api('PUT', '/api/regions', out).then(() => toast('Regions saved for everyone', 'ok'))
      .catch(err => toast('Could not save regions: ' + err.message, 'error'));
    return true;
  }
  try { localStorage.setItem(REGION_KEY, JSON.stringify(out)); return true; }
  catch (e) { return false; }
}

// Mirrors the derivation in fetch_data.py: trust the AU-XX code, guess nothing else.
function suggestRegion(name) {
  const u = (name || '').toUpperCase();
  if (u.includes('AU-WA')) return 'West';
  if (['AU-QLD', 'AU-NSW', 'AU-VIC', 'AU-ACT', 'AU-TAS'].some(c => u.includes(c))) return 'East';
  return '';
}

/* --------------------------------------------------- delivery date overlay
   Estimated Delivery Date and Promised Delivery Date are real PO-line fields
   RSGx uses day to day - confirmed directly on SiteSense's own PO Dashboard
   report, with values that genuinely differ from the PO's created date - but
   neither is reachable through this GraphQL API (checked exhaustively against
   the exact PO line the UI displayed a value for). Kept the same way as
   regions: an overlay entered here, keyed by material GUID so it survives a
   refresh reordering rows, held in this browser immediately, and downloaded to
   delivery_dates.json to bake into the next refresh for everyone. */
const DELIVERY_KEY = 'rsgx.sitesense.delivery_dates.v1';
const DELIVERY_FIELDS = ['estimated', 'promised'];

const deliveryDates = (() => {
  const map = {};
  Object.entries(D.delivery_dates || {}).forEach(([guid, v]) => { map[guid] = { ...v }; });
  if (SERVER) return map;   // shared and current on the server; see regionByProject
  try {
    const saved = JSON.parse(localStorage.getItem(DELIVERY_KEY) || '{}');
    Object.entries(saved).forEach(([guid, v]) => { map[guid] = { ...(map[guid] || {}), ...v }; });
  } catch (e) { /* unreadable or blocked storage: fall back to the baked values */ }
  return map;
})();
const deliveryDateOf = (m, field) => (deliveryDates[matGuid(m)] || {})[field] || '';
function setDeliveryDate(m, field, value) {
  const g = matGuid(m);
  const cur = { ...(deliveryDates[g] || {}) };
  if (value) cur[field] = value; else delete cur[field];
  if (Object.keys(cur).length) deliveryDates[g] = cur; else delete deliveryDates[g];
  // On the server each edit is saved straight away, for everyone.
  if (SERVER) {
    api('PUT', '/api/delivery-dates', { guid: g, field, value: value || '' })
      .then(() => toast('Delivery date saved for everyone', 'ok'))
      .catch(err => toast('Could not save: ' + err.message, 'error'));
  }
}
function saveDeliveryDates() {
  if (SERVER) return true;   // already saved per edit in setDeliveryDate
  try { localStorage.setItem(DELIVERY_KEY, JSON.stringify(deliveryDates)); return true; }
  catch (e) { return false; }
}

const SERIES = ['--s1','--s2','--s3','--s4','--s5','--s6','--s7','--s8'];
const cvar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nf = n => (n ?? 0).toLocaleString('en-AU', {maximumFractionDigits: 2});
const el = (html) => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; };

// ---------------------------------------------------------------- tooltip
const tipEl = document.getElementById('tip');
function tipShow(e, html) {
  tipEl.innerHTML = html; tipEl.style.display = 'block';
  const r = tipEl.getBoundingClientRect();
  let x = e.clientX + 14, y = e.clientY + 16;
  if (x + r.width > innerWidth - 8) x = e.clientX - r.width - 12;
  if (y + r.height > innerHeight - 8) y = e.clientY - r.height - 12;
  tipEl.style.left = x + 'px'; tipEl.style.top = y + 'px';
}
const tipHide = () => { tipEl.style.display = 'none'; };

// ---------------------------------------------------------------- global project filter
let selectedProjects = null;                 // null means every project
let activeRegion = '';                       // '' means every region

// The picker's checkboxes track only the project choice, so a region filter
// never appears to untick projects the user selected by hand.
const projectSelected = pIdx => selectedProjects === null || selectedProjects.has(pIdx);
const inScope = pIdx => projectSelected(pIdx)
  && (!activeRegion || (activeRegion === 'Unassigned' ? !regionOf(pIdx) : regionOf(pIdx) === activeRegion));

function projectPicker(onChange) {
  const node = el(`
    <div class="field picker">
      <label for="projbtn">Project</label>
      <button class="btn" id="projbtn" aria-haspopup="true" aria-expanded="false">All 35 projects</button>
      <div class="picker-pop" data-open="false">
        <input type="search" placeholder="Search projects" aria-label="Search projects">
        <div class="picker-actions">
          <button class="btn btn-quiet" data-act="all">Select all</button>
          <button class="btn btn-quiet" data-act="none">Clear</button>
          <button class="btn" data-act="apply">Apply</button>
        </div>
        <div class="picker-list"></div>
      </div>
    </div>`);

  const btn = node.querySelector('#projbtn');
  const pop = node.querySelector('.picker-pop');
  const list = node.querySelector('.picker-list');
  const search = node.querySelector('input[type="search"]');

  list.innerHTML = PROJ.map((n, i) =>
    `<label><input type="checkbox" value="${i}" ${projectSelected(i) ? 'checked' : ''}><span>${esc(n)}</span></label>`
  ).join('');

  const label = () => {
    btn.textContent = selectedProjects === null
      ? `All ${PROJ.length} projects`
      : selectedProjects.size === 1
        ? PROJ[[...selectedProjects][0]].replace(/^Procore:\s*/, '').slice(0, 30)
        : `${selectedProjects.size} of ${PROJ.length} projects`;
    btn.title = selectedProjects === null ? 'All projects included'
      : [...selectedProjects].map(i => PROJ[i]).join('\n');
  };
  label();

  /* Charts can change the project scope directly, so the picker has to be able
     to re-read the shared state rather than only writing to it. */
  node.sync = () => {
    label();
    list.querySelectorAll('input[type="checkbox"]').forEach(cb => {
      cb.checked = projectSelected(+cb.value);
    });
  };

  btn.onclick = (e) => {
    e.stopPropagation();
    const open = pop.dataset.open === 'true';
    pop.dataset.open = String(!open);
    btn.setAttribute('aria-expanded', String(!open));
    if (!open) search.focus();
  };
  pop.onclick = e => e.stopPropagation();
  document.addEventListener('click', () => { pop.dataset.open = 'false'; btn.setAttribute('aria-expanded','false'); });

  search.oninput = () => {
    const q = search.value.toLowerCase();
    list.querySelectorAll('label').forEach(l => {
      l.style.display = l.textContent.toLowerCase().includes(q) ? '' : 'none';
    });
  };
  node.querySelector('[data-act="all"]').onclick = () =>
    list.querySelectorAll('input').forEach(c => c.checked = true);
  node.querySelector('[data-act="none"]').onclick = () =>
    list.querySelectorAll('input').forEach(c => c.checked = false);
  node.querySelector('[data-act="apply"]').onclick = () => {
    const on = [...list.querySelectorAll('input')].filter(c => c.checked).map(c => +c.value);
    selectedProjects = on.length === PROJ.length ? null : new Set(on);
    label();
    pop.dataset.open = 'false'; btn.setAttribute('aria-expanded','false');
    onChange();
  };
  return node;
}

/* Build a filter rail. `specs` describe the per-tab controls; the project
   picker is always first so every dashboard shares one scoping control. */
function buildRail(specs, state, onChange) {
  const rail = el('<div class="rail"></div>');

  /* Region sits beside the project picker because it scopes the whole page the
     same way a project does, rather than being a per-tab attribute filter. */
  const regionField = el(`<div class="field"><label for="f_region">Region</label>
    <select id="f_region"><option value="">All regions</option></select></div>`);
  const regionSel = regionField.querySelector('select');
  const regionOpts = () => {
    const present = new Set(D.projects.map((p, i) => regionOf(i) || 'Unassigned'));
    return REGION_CHOICES.filter(r => present.has(r)).concat(present.has('Unassigned') ? ['Unassigned'] : []);
  };
  regionSel.onchange = () => { activeRegion = regionSel.value; onChange(); };
  rail.appendChild(regionField);

  const picker = projectPicker(onChange);
  rail.appendChild(picker);
  const controls = [];

  specs.forEach(sp => {
    const id = 'f_' + sp.key;
    if (sp.type === 'search') {
      const f = el(`<div class="field"><label for="${id}">${esc(sp.label)}</label>
        <input type="search" id="${id}" placeholder="${esc(sp.placeholder || '')}"></div>`);
      const inp = f.querySelector('input');
      inp.value = state[sp.key] || '';
      let t;
      inp.oninput = () => { clearTimeout(t); t = setTimeout(() => { state[sp.key] = inp.value; onChange(); }, 180); };
      controls.push({ key: sp.key, node: inp });
      rail.appendChild(f);
    } else {
      const f = el(`<div class="field"><label for="${id}">${esc(sp.label)}</label>
        <select id="${id}"><option value="">${esc(sp.anyLabel || 'Any')}</option></select></div>`);
      const sel = f.querySelector('select');
      sel.onchange = () => { state[sp.key] = sel.value; onChange(); };
      controls.push({ key: sp.key, node: sel, spec: sp });
      rail.appendChild(f);
    }
  });

  rail.appendChild(el('<div class="spacer"></div>'));
  const reset = el('<button class="btn btn-quiet">Reset filters</button>');
  reset.onclick = () => {
    selectedProjects = null;
    activeRegion = '';
    Object.keys(state).forEach(k => delete state[k]);
    onChange();
  };
  rail.appendChild(reset);

  /* Clicking a chart writes straight into `state`, so the controls have to be
     pulled back into line afterwards or the rail would show stale values.
     Select options are also rebuilt here rather than at mount, so each dropdown
     only ever offers values that exist under the filters currently applied. A
     cost code belonging to a project you have filtered out should not be
     offered, and a selection that stops being valid is dropped rather than left
     in place returning nothing. */
  rail.sync = () => {
    const rOpts = regionOpts();
    const rExisting = [...regionSel.options].slice(1).map(o => o.value);
    if (rExisting.length !== rOpts.length || rExisting.some((v, i) => v !== rOpts[i])) {
      regionSel.innerHTML = '<option value="">All regions</option>'
        + rOpts.map(r => `<option value="${esc(r)}">${esc(r)}</option>`).join('');
    }
    if (activeRegion && !rOpts.includes(activeRegion)) activeRegion = '';
    regionSel.value = activeRegion;

    picker.sync();
    controls.forEach(c => {
      if (!c.spec) {                       // free text input
        const v = state[c.key] || '';
        if (c.node.value !== v) c.node.value = v;
        return;
      }
      const opts = c.spec.options();
      if (state[c.key] && !opts.includes(state[c.key])) delete state[c.key];
      const existing = [...c.node.options].slice(1).map(o => o.value);
      const changed = existing.length !== opts.length || existing.some((v, i) => v !== opts[i]);
      if (changed) {
        c.node.innerHTML = `<option value="">${esc(c.spec.anyLabel || 'Any')}</option>`
          + opts.map(o => `<option value="${esc(o)}">${esc(o)}</option>`).join('');
      }
      c.node.value = state[c.key] || '';
    });
  };
  rail.sync();
  return rail;
}

/* Removable chips for whatever is currently narrowing the view, so a filter
   applied by clicking a chart is visible and reversible in one action. */
function activeChips(state, labels, onChange) {
  const wrap = el('<div class="chips"></div>');
  const add = (text, clear) => {
    const c = el(`<span class="chip">${esc(text)}<button aria-label="Remove filter">&times;</button></span>`);
    c.querySelector('button').onclick = () => { clear(); onChange(); };
    wrap.appendChild(c);
  };
  if (activeRegion) add(`Region: ${activeRegion}`, () => { activeRegion = ''; });
  if (selectedProjects !== null) {
    add(selectedProjects.size === 1
      ? `Project: ${PROJ[[...selectedProjects][0]]}`
      : `Projects: ${selectedProjects.size} of ${PROJ.length}`,
      () => { selectedProjects = null; });
  }
  Object.keys(state).forEach(k => {
    if (!state[k]) return;
    add(`${labels[k] || k}: ${state[k]}`, () => { delete state[k]; });
  });
  if (!wrap.children.length) return null;
  const clearAll = el('<button class="btn btn-quiet">Clear all</button>');
  clearAll.onclick = () => {
    selectedProjects = null;
    activeRegion = '';
    Object.keys(state).forEach(k => delete state[k]);
    onChange();
  };
  wrap.appendChild(clearAll);
  return wrap;
}

// ---------------------------------------------------------------- charts
/* SVG children must be built in the SVG namespace. Going through an HTML
   <template> would silently produce unrendered HTML-namespace nodes, so the
   whole chart is parsed as one SVG document and imported. */
function svgNode(markup) {
  const doc = new DOMParser().parseFromString(markup, 'image/svg+xml');
  return document.importNode(doc.documentElement, true);
}

/* Charts are drawn at the real pixel width of their box and redrawn when that
   box resizes, rather than drawn once at a fixed size and stretched to fit.
   Stretching scaled the chart's text and bar thickness with the box width, so
   charts ballooned on wide screens, shrank on narrow ones, and cancelled out
   browser zoom while the rest of the page zoomed normally. Drawn 1:1, labels
   stay at the page's own text size and only the bar lengths and spacing adapt.
   `height` is known up front so the box reserves its space before the first
   draw and nothing below it jumps. */
function responsiveChart(height, draw) {
  const host = el('<div class="chart-host"></div>');
  host.style.minHeight = height + 'px';
  let lastW = 0, attached = false;
  // Measures synchronously rather than waiting for an animation frame, which
  // never comes in a background tab or while printing - the chart would sit
  // empty until the tab was shown.
  const tryDraw = () => {
    if (!host.isConnected) return false;
    attached = true;
    const w = Math.floor(host.clientWidth);
    if (w >= 120 && w !== lastW) { lastW = w; host.replaceChildren(draw(w)); }
    return true;
  };
  // First draw: the host is built before it is put on the page, so poll briefly
  // until it is attached and has a width.
  let tries = 0;
  (function firstDraw() { if (!tryDraw() && tries++ < 100) setTimeout(firstDraw, 20); })();
  // ResizeObserver catches the box changing for any reason (a column collapsing
  // at the mobile breakpoint, the rail wrapping); the window resize event backs
  // it up, since observers pause while a page is not being rendered.
  const onChange = () => {
    // Only a host that was on the page and has since been removed (the tab
    // re-rendered) is finished with; not-yet-attached is normal early on.
    if (!host.isConnected) {
      if (attached) { ro.disconnect(); window.removeEventListener('resize', onChange); }
      return;
    }
    tryDraw();
  };
  const ro = new ResizeObserver(onChange);
  ro.observe(host);
  window.addEventListener('resize', onChange);
  return host;
}

function barChart(rows, opts = {}) {
  if (!rows.length) return el('<p class="empty">Nothing to plot for this selection.</p>');
  /* `slots` is the row count shared by both charts in a pair, so two charts
     side by side occupy the same height instead of one towering over the other.
     Bars grow to use the reserved space, up to a sane maximum, and the group is
     centred so a short chart reads as deliberate rather than as a rendering gap. */
  const slots = Math.max(rows.length, opts.slots || 0);
  const H = 8 + slots * 29;
  return responsiveChart(H, W => drawBarChart(rows, opts, W, slots, H));
}

function drawBarChart(rows, opts, W, slots, H) {
  // The label column gives up space on a narrow box rather than squeezing bars to nothing.
  const padL = Math.min(opts.padL || 200, Math.max(110, Math.round(W * 0.4))), padT = 4;
  // padR must fit the longest value label, which can be a full currency figure.
  const padR = Math.max(60, 8 + 7 * Math.max(...rows.map(r => nf(r.value).length)));
  const gap = 9;
  const bar = Math.min(34, Math.max(16, Math.round((slots * 29) / rows.length) - gap));
  const contentH = rows.length * (bar + gap);
  const originY = padT + Math.max(0, (H - padT * 2 - contentH) / 2);
  const max = Math.max(1, ...rows.map(r => Math.abs(r.value)));
  const fill = opts.color || cvar('--s1');
  // Label budget scales with the space actually reserved for labels.
  const trunc = (s, n = Math.max(12, Math.floor(padL / 6.2))) =>
    s.length > n ? s.slice(0, n - 1) + '…' : s;

  const pickable = typeof opts.pick === 'function';

  let parts = '';
  rows.forEach((r, i) => {
    const y = originY + i * (bar + gap);
    const w = Math.max(2, (W - padL - padR) * (Math.abs(r.value) / max));
    const hint = pickable ? `Filter by ${r.label}` : `${r.label}: ${nf(r.value)}`;
    parts += `<g class="row">`
          +  `<text x="${padL - 9}" y="${y + bar / 2 + 4}" text-anchor="end" class="tick rowlabel"`
          +  ` fill="var(--ink-2)" font-size="12">${esc(trunc(r.label))}</text>`
          +  `<rect class="bar" x="${padL}" y="${y}" width="${w}" height="${bar}" rx="3.5" fill="${fill}"></rect>`
          +  `<text x="${padL + w + 7}" y="${y + bar / 2 + 4}" class="tick" font-size="12">${nf(r.value)}</text>`
          +  `<rect class="hit" x="0" y="${y - gap / 2}" width="${W}" height="${bar + gap}"`
          +  ` data-i="${i}"${pickable ? ' tabindex="0" role="button"' : ''}`
          +  ` aria-label="${esc(hint)}"></rect>`
          +  `</g>`;
  });

  const svg = svgNode(`<svg xmlns="http://www.w3.org/2000/svg" class="chart"
    width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="${pickable ? 'group' : 'img'}"
    aria-label="${esc(opts.aria || 'Bar chart')}">${parts}</svg>`);

  svg.querySelectorAll('rect.hit').forEach(hit => {
    const r = rows[+hit.getAttribute('data-i')];
    const tipHtml = `<strong>${esc(r.label)}</strong><br>${nf(r.value)}`
      + (r.note ? '<br>' + esc(r.note) : '')
      + (pickable ? '<br><em>Click to filter</em>' : '');
    hit.addEventListener('mousemove', e => tipShow(e, tipHtml));
    hit.addEventListener('mouseleave', tipHide);
    if (!pickable) return;
    hit.addEventListener('click', () => { tipHide(); opts.pick(r); });
    hit.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tipHide(); opts.pick(r); }
    });
  });
  return svg;
}

function lineChart(series, months, opts = {}) {
  if (!months.length) return el('<p class="empty">Nothing to plot for this selection.</p>');
  const H = 240;
  return responsiveChart(H, W => drawLineChart(series, months, opts, W, H));
}

function drawLineChart(series, months, opts, W, H) {
  const padL = 52, padR = 14, padT = 10, padB = 26;
  const pw = W - padL - padR, ph = H - padT - padB;
  const max = Math.max(1, ...series.flatMap(s => s.values));
  const X = i => padL + (months.length > 1 ? (pw / (months.length - 1)) * i : 0);
  const Y = v => padT + ph - (v / max) * ph;

  let parts = '';
  for (let g = 0; g <= 4; g++) {
    const y = padT + ph * g / 4;
    parts += `<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" class="grid"></line>`
          +  `<text x="${padL - 8}" y="${y + 3.5}" text-anchor="end" class="tick">${nf(Math.round(max * (1 - g / 4)))}</text>`;
  }
  // Month labels need ~64px each at the page's text size; fit as many as the width allows.
  const every = Math.max(1, Math.ceil(months.length / Math.max(2, Math.floor(pw / 64))));
  months.forEach((m, i) => {
    if (i % every === 0 || i === months.length - 1) {
      parts += `<text x="${X(i)}" y="${H - 7}" text-anchor="middle" class="tick">${esc(m)}</text>`;
    }
  });
  const pickable = typeof opts.pick === 'function';

  series.forEach((s, si) => {
    const c = cvar(SERIES[si % SERIES.length]);
    parts += `<polyline points="${s.values.map((v, i) => `${X(i)},${Y(v)}`).join(' ')}" fill="none"`
          +  ` stroke="${c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></polyline>`;
  });
  // Hit targets are drawn last so they sit above every line, and are far larger
  // than the 3.6px marker they belong to.
  series.forEach((s, si) => {
    const c = cvar(SERIES[si % SERIES.length]);
    s.values.forEach((v, i) => {
      parts += `<circle class="pt-hit" cx="${X(i)}" cy="${Y(v)}" r="11" data-s="${si}" data-i="${i}"`
            +  `${pickable ? ' tabindex="0" role="button"' : ''}`
            +  ` aria-label="${esc(`${s.label}, ${months[i]}, ${nf(v)}${pickable ? '. Filter to this month' : ''}`)}"></circle>`
            +  `<circle class="pt" cx="${X(i)}" cy="${Y(v)}" r="3.6" fill="${c}" pointer-events="none"></circle>`;
    });
  });

  const svg = svgNode(`<svg xmlns="http://www.w3.org/2000/svg" class="chart"
    width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="${pickable ? 'group' : 'img'}"
    aria-label="${esc(opts.aria || 'Trend chart')}">${parts}</svg>`);

  svg.querySelectorAll('circle.pt-hit').forEach(dot => {
    const s = series[+dot.getAttribute('data-s')], i = +dot.getAttribute('data-i');
    const tipHtml = `<strong>${esc(s.label)}</strong><br>${esc(months[i])}: ${nf(s.values[i])}`
      + (pickable ? '<br><em>Click to filter to this month</em>' : '');
    dot.addEventListener('mousemove', e => tipShow(e, tipHtml));
    dot.addEventListener('mouseleave', tipHide);
    if (!pickable) return;
    dot.addEventListener('click', () => { tipHide(); opts.pick(months[i]); });
    dot.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tipHide(); opts.pick(months[i]); }
    });
  });
  return svg;
}

const keyRow = series => el(`<div class="key">${series.map((s, i) =>
  `<span><i style="background:${cvar(SERIES[i % SERIES.length])}"></i>${esc(s.label)}</span>`).join('')}</div>`);

/* ------------------------------------------------------- Excel (.xlsx) export
   Written by hand because the artifact CSP blocks external libraries. A real
   workbook is worth the effort over CSV: cell types are declared, so Excel will
   not reinterpret a cost code like 3000-3100-3110-3111 or strip leading zeros
   from a part number. Entries are STORED (uncompressed), which keeps the zip
   writer to a CRC and a couple of headers. */
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let i = 0; i < 256; i++) {
    let c = i;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[i] = c >>> 0;
  }
  return t;
})();
function crc32(bytes) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

function zipStore(files) {
  const enc = new TextEncoder();
  const parts = [], central = [];
  let offset = 0;
  files.forEach(f => {
    const name = enc.encode(f.name);
    const data = enc.encode(f.text);
    const crc = crc32(data), size = data.length;
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true);
    lh.setUint16(8, 0, true); lh.setUint32(14, crc, true);
    lh.setUint32(18, size, true); lh.setUint32(22, size, true);
    lh.setUint16(26, name.length, true);
    parts.push(new Uint8Array(lh.buffer), name, data);

    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true);
    ch.setUint16(10, 0, true); ch.setUint32(16, crc, true);
    ch.setUint32(20, size, true); ch.setUint32(24, size, true);
    ch.setUint16(28, name.length, true); ch.setUint32(42, offset, true);
    central.push(new Uint8Array(ch.buffer), name);
    offset += 30 + name.length + size;
  });
  const centralBytes = central.reduce((a, b) => a + b.length, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true);
  end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
  end.setUint32(12, centralBytes, true); end.setUint32(16, offset, true);
  const all = [...parts, ...central, new Uint8Array(end.buffer)];
  const out = new Uint8Array(all.reduce((a, b) => a + b.length, 0));
  let p = 0;
  all.forEach(b => { out.set(b, p); p += b.length; });
  return out;
}

const xesc = s => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]))
                           .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, '');
const colRef = n => { let s = ''; n++; while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; };

function exportXlsx(cols, rows, filename, sheetName) {
  const nCols = cols.length, nRows = rows.length;
  let sd = `<row r="1">` + cols.map((c, i) =>
    `<c r="${colRef(i)}1" t="inlineStr" s="1"><is><t xml:space="preserve">${xesc(c.label)}</t></is></c>`).join('') + `</row>`;
  rows.forEach((r, ri) => {
    let cells = '';
    cols.forEach((c, i) => {
      const v = c.value(r);
      const ref = `${colRef(i)}${ri + 2}`;
      if (typeof v === 'number' && isFinite(v)) cells += `<c r="${ref}"><v>${v}</v></c>`;
      else {
        const s = v == null ? '' : String(v);
        if (s) cells += `<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${xesc(s)}</t></is></c>`;
      }
    });
    sd += `<row r="${ri + 2}">${cells}</row>`;
  });

  const lastCol = colRef(nCols - 1);
  const sheet = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>`
    + `<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">`
    + `<sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>`
    + `<cols>` + cols.map((c, i) =>
        `<col min="${i + 1}" max="${i + 1}" width="${c.num ? 14 : 30}" customWidth="1"/>`).join('') + `</cols>`
    + `<sheetData>${sd}</sheetData>`
    + `<autoFilter ref="A1:${lastCol}${Math.max(1, nRows + 1)}"/>`
    + `</worksheet>`;

  const files = [
    { name: '[Content_Types].xml', text: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>` },
    { name: '_rels/.rels', text: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>` },
    { name: 'xl/workbook.xml', text: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="${xesc((sheetName || 'Data').slice(0, 31))}" sheetId="1" r:id="rId1"/></sheets></workbook>` },
    { name: 'xl/_rels/workbook.xml.rels', text: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>` },
    { name: 'xl/styles.xml', text: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border/></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs></styleSheet>` },
    { name: 'xl/worksheets/sheet1.xml', text: sheet },
  ];

  return zipStore(files);
}

function buildCsv(cols, rows) {
  const q = v => { const s = v == null ? '' : String(v); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const lines = [cols.map(c => q(c.label)).join(',')];
  rows.forEach(r => lines.push(cols.map(c => q(c.value(r))).join(',')));
  return '\ufeff' + lines.join('\r\n');   // BOM so Excel decodes UTF-8
}

/* Local file: a real .xlsx via an anchor, as before. Hosted artifact: the viewer
   sandbox blocks anchor downloads, so the save goes through the viewer's own
   confirmation via the downloads capability. Its allowlist has no xlsx, so the
   hosted path degrades xlsx -> csv -> txt, whichever the view accepts. */
async function saveTable(cols, rows, filename, sheetName) {
  const hosted = typeof window.claude !== 'undefined' && window.claude && typeof window.claude.use === 'function';
  if (!hosted) {
    const blob = new Blob([exportXlsx(cols, rows, filename, sheetName)],
      { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    return { status: 'saved', format: 'xlsx' };
  }
  const downloads = await window.claude.use('downloads');
  if (!downloads) return { status: 'unavailable' };
  const attempts = [
    { filename, data: () => exportXlsx(cols, rows, filename, sheetName), format: 'xlsx' },
    { filename: filename.replace(/\.xlsx$/, '.csv'), data: () => buildCsv(cols, rows), format: 'csv' },
    { filename: filename.replace(/\.xlsx$/, '.txt'), data: () => buildCsv(cols, rows), format: 'txt' },
  ];
  let last;
  for (const t of attempts) {
    try {
      await downloads.save({ filename: t.filename, data: t.data() });
      return { status: 'saved', format: t.format };
    } catch (err) {
      last = err;
      if (err && (err.code === 'rejected_extension' || err.code === 'extension_not_enabled')) continue;
      return { status: err && err.code === 'declined' ? 'declined'
             : err && err.code === 'rate_limited' ? 'rate_limited' : 'error', err };
    }
  }
  return { status: 'error', err: last };
}

// A filename that records what the export was actually filtered to.
function exportName(base) {
  const bits = [base];
  if (activeRegion) bits.push(activeRegion);
  if (selectedProjects && selectedProjects.size === 1) {
    bits.push(PROJ[[...selectedProjects][0]].replace(/^Procore:\s*/, '').replace(/[^A-Za-z0-9]+/g, '-').slice(0, 28));
  } else if (selectedProjects) bits.push(`${selectedProjects.size}-projects`);
  const d = new Date(D.generated_at);
  bits.push(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`);
  return bits.join('_').replace(/_+/g, '_') + '.xlsx';
}

// ---------------------------------------------------------------- data table
function dataTable(cols, rows, opts = {}) {
  const size = opts.pageSize || 50;
  let page = 0;
  let sortAt = opts.sortAt ?? null, dir = opts.sortDir ?? -1;
  // One free-text filter per column, entered straight into that column's own
  // heading - "filterable headings" - on top of whatever the sidebar rail
  // already narrowed. Blank for every column until the user types into one.
  const filterable = opts.filterable !== false;
  const colFilters = cols.map(() => '');
  const colGet = c => r => c.filterVal ? c.filterVal(r) : (c.sortVal ? c.sortVal(r) : c.value(r));
  // Each heading's dropdown lists every distinct value this column holds across
  // the rows handed to this table, so "filterable heading" means pick-from-list
  // rather than type-to-search - except for a column like Material, with tens
  // of thousands of distinct names. A <select> that long is not a dropdown
  // anyone can use and is heavy enough to slow the table down on every repaint,
  // so a column over this cardinality keeps the type-to-search box instead.
  const MAX_DROPDOWN_OPTIONS = 500;
  const colOptions = cols.map(c => {
    const get = colGet(c);
    const vals = [...new Set(rows.map(get).filter(v => v !== '' && v != null))];
    vals.sort((a, b) => c.num ? (a - b) : String(a).localeCompare(String(b)));
    return vals;
  });
  // Numeric columns (quantities, values) are excluded even when the distinct
  // count is small - "pick the exact quantity from a list" is not a filter
  // anyone wants; a search box that matches on the displayed number is more
  // useful there.
  const colIsDropdown = cols.map((c, i) => !c.num && colOptions[i].length > 0 && colOptions[i].length <= MAX_DROPDOWN_OPTIONS);
  let filtered = rows, view = rows;

  function applyFilters() {
    filtered = colFilters.some(Boolean)
      ? rows.filter(r => cols.every((c, i) => {
          const f = colFilters[i];
          if (!f) return true;
          const v = String(colGet(c)(r) ?? '');
          return colIsDropdown[i] ? v === f : v.toLowerCase().includes(f);
        }))
      : rows;
    view = filtered;
  }

  const wrap = el(`<div class="tablewrap"><div class="tablescroll"></div>
    <div class="tfoot"><span class="count"></span>
    <span class="pages"><button class="btn btn-export" data-p="xlsx" title="Export every filtered row, not just this page">Export to Excel</button>
    <button class="btn" data-p="first">First</button>
    <button class="btn" data-p="prev">Prev</button><span class="at"></span>
    <button class="btn" data-p="next">Next</button></span></div></div>`);
  const scroll = wrap.querySelector('.tablescroll');

  /* Exports the whole filtered and sorted set, which is almost always what is
     wanted, rather than the fifty rows currently on screen. */
  wrap.querySelector('[data-p="xlsx"]').onclick = async () => {
    const btn = wrap.querySelector('[data-p="xlsx"]');
    const was = btn.textContent;
    btn.disabled = true; btn.textContent = 'Preparing...';
    try {
      const r = await saveTable(cols, view, exportName(opts.exportName || 'SiteSense'), opts.exportName || 'Data');
      btn.textContent = r.status === 'saved' ? `Exported ${nf(view.length)} rows${r.format !== 'xlsx' ? ' (' + r.format + ')' : ''}`
        : r.status === 'declined' ? 'Cancelled'
        : r.status === 'rate_limited' ? 'Busy, try again shortly'
        : r.status === 'unavailable' ? 'Saving unavailable here'
        : 'Export failed';
      if (r.status === 'error') console.error('export failed', r.err);
    } catch (err) { btn.textContent = 'Export failed'; console.error('export failed', err); }
    setTimeout(() => { btn.textContent = was; btn.disabled = false; }, 2400);
  };

  function sort() {
    if (sortAt === null) { view = filtered; return; }
    const c = cols[sortAt];
    view = filtered.slice().sort((a, b) => {
      const x = c.sortVal ? c.sortVal(a) : c.value(a), y = c.sortVal ? c.sortVal(b) : c.value(b);
      return (typeof x === 'number' && typeof y === 'number')
        ? (x - y) * dir : String(x).localeCompare(String(y)) * dir;
    });
  }

  function paint() {
    // Column filter controls get rebuilt along with everything else below, so
    // a repaint triggered by picking one would otherwise drop keyboard focus
    // (and, for the text-search fallback, the caret position mid-keystroke).
    const wasFocused = scroll.querySelector('.th-filter:focus');
    const focusedAt = wasFocused ? +wasFocused.dataset.i : null;
    const caret = wasFocused && wasFocused.tagName === 'INPUT' ? wasFocused.selectionStart : null;

    const pages = Math.max(1, Math.ceil(view.length / size));
    page = Math.min(page, pages - 1);
    const slice = view.slice(page * size, page * size + size);
    scroll.innerHTML = `<table>
      <thead><tr>${cols.map((c, i) => `<th class="${c.num ? 'num' : ''}">
        <div class="th-label" data-i="${i}" title="Sort by ${esc(c.label)}">${esc(c.label)}${sortAt === i ? ` <span class="dir">${dir === 1 ? '↑' : '↓'}</span>` : ''}</div>
        ${!filterable ? '' : colIsDropdown[i] ? `<select class="th-filter" data-i="${i}">
          <option value="">${esc(c.label)} (all)</option>
          ${colOptions[i].map(v => `<option value="${esc(String(v))}"${colFilters[i] === String(v) ? ' selected' : ''}>${esc(String(v))}</option>`).join('')}
        </select>` : `<input class="th-filter" type="search" data-i="${i}" placeholder="Search…" value="${esc(colFilters[i])}">`}
      </th>`).join('')}</tr></thead>
      <tbody>${slice.length ? slice.map(r => `<tr>${cols.map(c =>
        `<td class="${c.num ? 'num' : ''}">${c.cell ? c.cell(r) : esc(c.value(r))}</td>`).join('')}</tr>`).join('')
        : `<tr><td colspan="${cols.length}" class="empty">No rows match these filters.</td></tr>`}</tbody>
      </table>`;

    wrap.querySelector('.count').textContent =
      `${nf(view.length)} row${view.length === 1 ? '' : 's'}`;
    wrap.querySelector('.at').textContent = `Page ${page + 1} of ${pages}`;
    wrap.querySelector('[data-p="first"]').disabled = page === 0;
    wrap.querySelector('[data-p="prev"]').disabled = page === 0;
    wrap.querySelector('[data-p="next"]').disabled = page >= pages - 1;

    scroll.querySelectorAll('.th-label').forEach(lbl => lbl.onclick = () => {
      const i = +lbl.dataset.i;
      if (sortAt === i) dir *= -1; else { sortAt = i; dir = -1; }
      sort(); page = 0; paint();
    });
    scroll.querySelectorAll('select.th-filter').forEach(sel => {
      sel.onchange = () => {
        colFilters[+sel.dataset.i] = sel.value;
        applyFilters(); sort(); page = 0; paint();
      };
      sel.onclick = e => e.stopPropagation();
    });
    scroll.querySelectorAll('input.th-filter').forEach(inp => {
      let t;
      inp.oninput = () => {
        clearTimeout(t);
        t = setTimeout(() => {
          colFilters[+inp.dataset.i] = inp.value.trim().toLowerCase();
          applyFilters(); sort(); page = 0; paint();
        }, 180);
      };
      inp.onclick = e => e.stopPropagation();
    });

    if (focusedAt !== null) {
      const sel = scroll.querySelector(`.th-filter[data-i="${focusedAt}"]`);
      if (sel && sel.tagName === 'INPUT' && caret !== null) { sel.focus(); sel.setSelectionRange(caret, caret); }
      else if (sel) sel.focus();
    }
    // Cells with their own interactive controls (an editable select or date
    // input) need rebinding after every repaint, not just the first one -
    // sorting, paging or filtering a column all rebuild these cells same as
    // any other. Callers with such cells hook in here instead of binding once
    // from outside, which would go stale the moment the table repaints itself.
    if (opts.onRepaint) opts.onRepaint(scroll);
  }

  wrap.querySelector('[data-p="first"]').onclick = () => { page = 0; paint(); };
  wrap.querySelector('[data-p="prev"]').onclick = () => { page--; paint(); };
  wrap.querySelector('[data-p="next"]').onclick = () => { page++; paint(); };

  applyFilters(); sort(); paint();
  return wrap;
}

function strip(items) {
  return el(`<dl class="strip">${items.map(i =>
    `<div><dt>${esc(i.label)}</dt><dd class="${i.flag ? 'flag-alert' : ''}">${i.value}${i.unit ? `<small>${esc(i.unit)}</small>` : ''}</dd></div>`).join('')}</dl>`);
}

function block(title, hint, ...children) {
  const b = el(`<section class="block"><h3>${esc(title)}</h3>${hint ? `<p class="hint">${esc(hint)}</p>` : ''}</section>`);
  children.filter(Boolean).forEach(c => b.appendChild(c));
  return b;
}

/* Two bar charts sharing one row. Both are given the same number of row slots so
   they finish at the same height, which is what keeps the pair looking balanced
   when one has ten bars and the other has two. */
function chartPair(a, b) {
  const slots = Math.max(a.rows.length, b.rows.length);
  const cols = el('<div class="split"></div>');
  cols.appendChild(block(a.title, a.hint, barChart(a.rows, { ...a.opts, slots })));
  cols.appendChild(block(b.title, b.hint, barChart(b.rows, { ...b.opts, slots })));
  return cols;
}

const uniqSorted = vals => [...new Set(vals.filter(Boolean))].sort((a, b) => a.localeCompare(b));

/* Clicking a project bar scopes to that project alone. Clicking the same bar
   again when it is already the only project restores the full portfolio, so a
   chart click is always reversible from the chart itself. */
function pickProject(name) {
  const i = PROJ.indexOf(name);
  if (i < 0) return;
  selectedProjects = (selectedProjects && selectedProjects.size === 1 && selectedProjects.has(i))
    ? null : new Set([i]);
}
// Same toggle behaviour for the plain string filters.
const pickValue = (state, key, value) => {
  state[key] = state[key] === value ? '' : value;
};

// ================================================================ TAB: Overview (front page)
/* Rolls the five domains up per project, then to region. Everything headline is
   a count of documents, lines or parts, all of which add up cleanly. Value is
   carried as a secondary figure only, because it depends on unit costs that are
   not uniformly reliable (see the Asset Tracking tab). */
function overviewByProject() {
  const rows = PROJ.map((name, i) => ({
    i, name, region: regionOf(i) || 'Unassigned',
    po: 0, receipts: 0, transfers: 0, inventory: 0, assets: 0,
    receiptLines: 0, receivedValue: 0, outstanding: 0,
  }));
  const bump = (key, docs) => (docs || []).forEach(d => { if (inScope(d[0])) rows[d[0]][key]++; });
  bump('po', (D.ledger_types.purchase_orders || {}).docs);
  bump('receipts', (D.ledger_types.receipts || {}).docs);
  bump('transfers', (D.ledger_types.transfer_notes || {}).docs);

  (D.inventory || []).forEach(r => { if (inScope(r[0])) rows[r[0]].inventory++; });
  (D.assets || []).forEach(r => {
    if (!inScope(r[0])) return;
    rows[r[0]].assets++;
    if (r[A.ORD] - r[A.RCV] > 0) rows[r[0]].outstanding++;
  });
  (D.receipts || []).forEach(r => {
    if (!inScope(r[0])) return;
    rows[r[0]].receiptLines++;
    rows[r[0]].receivedValue += r[R.QTY] * (r[R.UC] || 0);
  });
  return rows.filter(r => inScope(r.i));
}

function tabOverview(stage) {
  const rail = buildRail([], {}, () => render());
  stage.appendChild(rail);
  const host = el('<div></div>');
  stage.appendChild(host);

  function render() {
    rail.sync();
    const per = overviewByProject();
    host.textContent = '';

    const chips = activeChips({}, {}, render);
    if (chips) host.appendChild(chips);

    if (!per.length) {
      host.appendChild(el('<p class="notice">No projects match the current scope.</p>'));
      return;
    }

    const sum = k => per.reduce((a, r) => a + r[k], 0);
    host.appendChild(strip([
      { label: 'Purchase orders', value: nf(sum('po')) },
      { label: 'Receipts', value: nf(sum('receipts')) },
      { label: 'Transfers', value: nf(sum('transfers')) },
      { label: 'Inventory lines', value: nf(sum('inventory')) },
      { label: 'Parts tracked', value: nf(sum('assets')) },
      { label: 'Parts outstanding', value: nf(sum('outstanding')), flag: sum('outstanding') > 0 },
      { label: 'Received value', value: '$' + nf(Math.round(sum('receivedValue'))) },
      { label: 'Active projects', value: nf(per.filter(r => r.po || r.receipts || r.transfers || r.inventory).length) },

    // ---- by region ----
    const regions = {};
    per.forEach(r => {

      g.projects++;
      ['po', 'receipts', 'transfers', 'inventory', 'assets', 'outstanding', 'receivedValue']
        .forEach(k => { g[k] += r[k]; });
    });
    const regionRows = Object.values(regions).sort((a, b) => b.po + b.receipts - (a.po + a.receipts));

    const docsByRegion = regionRows.map(g => ({
      label: g.region, value: g.po + g.receipts + g.transfers,

    const docsByProject = per.map(r => ({
      label: r.name.replace(/^Procore:\s*/, ''),
