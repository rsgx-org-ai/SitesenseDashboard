      note: `${r.region}\n${nf(r.inventory)} inventory lines`,
    })).filter(x => x.value > 0).sort((a, b) => b.value - a.value).slice(0, 9);

    host.appendChild(chartPair(
      { title: 'Documents by region', hint: 'Purchase orders, receipts and transfers combined. Click a bar to filter.',
        rows: docsByRegion,
        opts: { padL: 130, aria: 'Documents by region',
                pick: r => { activeRegion = activeRegion === r.label ? '' : r.label; render(); } } },
      { title: 'Busiest projects', hint: 'By document volume. Click a bar to filter.',
        rows: docsByProject,
        opts: { color: cvar('--s3'), padL: 210, aria: 'Documents by project',
                pick: r => { const full = PROJ.find(p => p.replace(/^Procore:\s*/, '') === r.label);
                             if (full) pickProject(full); render(); } } }));

    const numCol = (label, key, flag) => ({
      label, value: r => r[key], num: true,
      cell: r => r[key] ? (flag && r[key] ? `<span class="short">${nf(r[key])}</span>` : nf(r[key]))
                        : '<span class="zero">0</span>',
    });

    host.appendChild(block('By region', 'Click a region to scope the whole dashboard to it.',
      dataTable([
        { label: 'Region', value: r => r.region,
          cell: r => `<span class="dot ${r.region === 'East' ? 'dot-ok' : r.region === 'West' ? 'dot-warn' : ''}">${esc(r.region)}</span>` },
        numCol('Projects', 'projects'),
        numCol('Purchase orders', 'po'),
        numCol('Receipts', 'receipts'),
        numCol('Transfers', 'transfers'),
        numCol('Inventory lines', 'inventory'),
        numCol('Parts tracked', 'assets'),
        numCol('Parts outstanding', 'outstanding', true),
        { label: 'Received value', value: r => Math.round(r.receivedValue), num: true,
          cell: r => '$' + nf(Math.round(r.receivedValue)) },
      ], regionRows, { sortAt: 2, pageSize: 10, exportName: 'Overview_by_Region' })));

    host.appendChild(block('By project', 'Every project across all five domains.',
      dataTable([
        { label: 'Project', value: r => r.name,
          cell: r => `<span class="clip clip-wide" title="${esc(r.name)}">${esc(r.name)}</span>` },
        { label: 'Region', value: r => r.region },
        numCol('Purchase orders', 'po'),
        numCol('Receipts', 'receipts'),
        numCol('Transfers', 'transfers'),
        numCol('Inventory lines', 'inventory'),
        numCol('Parts tracked', 'assets'),
        numCol('Parts outstanding', 'outstanding', true),
        { label: 'Received value', value: r => Math.round(r.receivedValue), num: true,
          cell: r => r.receivedValue ? '$' + nf(Math.round(r.receivedValue)) : '<span class="zero">0</span>' },
      ], per, { sortAt: 2, pageSize: 40, exportName: 'Overview_by_Project' })));

    host.appendChild(el(`<p class="notice">Counts are documents, stock lines and parts, which add up
      across projects. Received value is the only money figure here and depends on purchase order unit
      costs, some of which are unreliable in the source data. The Asset Tracking tab explains where.</p>`));
  }
  render();
}

// ================================================================ TAB: Inventory
// inventory row: [p, m, required, ordered, received, issued, available, onHand, ship, hold, damage, scrap, return]
const INV = { R: 2, O: 3, RC: 4, IS: 5, AV: 6, OH: 7, HOLD: 9, DMG: 10, PO: 13, PODESC: 14, ESTD: 15 };

// SiteSense's Orders page renders timestamps as the browser's local calendar
// date, so a PO created at 22:02 UTC shows as the next day here. Same rule.
function localDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d)) return iso.slice(0, 10);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
const invState = {};

const STOCK_TESTS = {
  'In stock': r => r[INV.AV] > 0,
  'Nothing available': r => !(r[INV.AV] > 0),
  'Awaiting receipt': r => r[INV.O] - r[INV.RC] > 0,
  'Held or damaged': r => r[INV.HOLD] > 0 || r[INV.DMG] > 0,
};

function tabInventory(stage) {
  const st = invState;

  // Location and Checked By are not Inventory fields at all - they come off
  // the most recent Receipt against the same project + material, matching
  // where it was put away and who receipted it the way the Receipt Dashboard
  // records them. receipt row: [p, m, receipt, docStatus, cond, loc, checkedBy, ...]
  const latestReceiptByPM = {};
  (D.receipts || []).forEach(r => {
    const key = r[0] + '_' + r[1];
    const date = S(r[13]);
    const cur = latestReceiptByPM[key];
    if (!cur || date > cur.date) latestReceiptByPM[key] = { date, loc: S(r[5]), by: S(r[6]) };
  });
  const receivedLoc = (p, m) => (latestReceiptByPM[p + '_' + m] || {}).loc || '';
  const receivedBy  = (p, m) => (latestReceiptByPM[p + '_' + m] || {}).by || '';

  const passes = (r, skip) => {
    if (!inScope(r[0])) return false;
    if (skip !== 'type' && st.type && matType(r[1]) !== st.type) return false;
    if (skip !== 'uom' && st.uom && matUom(r[1]) !== st.uom) return false;
    if (skip !== 'q') {
      const q = (st.q || '').toLowerCase();
      if (q && !(matName(r[1]).toLowerCase().includes(q) || matDesc(r[1]).toLowerCase().includes(q))) return false;
    }
    if (skip !== 'stock' && st.stock && STOCK_TESTS[st.stock] && !STOCK_TESTS[st.stock](r)) return false;
    return true;
  };
  const optsFor = (key, get) => uniqSorted(D.inventory.filter(r => passes(r, key)).map(get));

  const rail = buildRail([
    { key: 'q', type: 'search', label: 'Material', placeholder: 'Name or description' },
    { key: 'type', type: 'select', label: 'Material type', anyLabel: 'All types',
      options: () => optsFor('type', r => matType(r[1])) },
    { key: 'uom', type: 'select', label: 'Unit', anyLabel: 'All units',
      options: () => optsFor('uom', r => matUom(r[1])) },
    { key: 'stock', type: 'select', label: 'Stock state', anyLabel: 'Any state',
      options: () => {
        const base = D.inventory.filter(r => passes(r, 'stock'));
        return Object.keys(STOCK_TESTS).filter(k => base.some(STOCK_TESTS[k]));
      } },
  ], st, () => render());
  stage.appendChild(rail);
  const host = el('<div></div>');
  stage.appendChild(host);

  const LABELS = { q: 'Material', type: 'Type', uom: 'Unit', stock: 'Stock state' };

  function render() {
    rail.sync();
    const rows = D.inventory.filter(r => passes(r));

    host.textContent = '';
    const chips = activeChips(invState, LABELS, render);
    if (chips) host.appendChild(chips);
    if (!rows.length) { host.appendChild(el('<p class="notice">No inventory matches these filters.</p>')); return; }

    /* Counts, not quantity sums. Quantities across rows mix units of measure
       (each, metres, days, lump sum) so a portfolio-wide quantity total is not
       a real number. Per-row quantities in the table below are single-unit and
       therefore sound. */
    const nWith = rows.filter(r => r[INV.AV] > 0).length;
    const nNone = rows.length - nWith;
    const nAwait = rows.filter(r => r[INV.O] - r[INV.RC] > 0).length;
    const nFlag = rows.filter(r => r[INV.HOLD] > 0 || r[INV.DMG] > 0).length;
    // Material records are project scoped in SiteSense, so one stock line is one
    // material. A separate "distinct materials" count would just repeat the total.
    host.appendChild(strip([
      { label: 'Stock lines', value: nf(rows.length) },
      { label: 'Projects', value: nf(new Set(rows.map(r => r[0])).size) },
      { label: 'Stock available', value: nf(nWith) },
      { label: 'Nothing available', value: nf(nNone) },
      { label: 'Awaiting receipt', value: nf(nAwait), flag: nAwait > 0 },
      { label: 'Held or damaged', value: nf(nFlag), flag: nFlag > 0 },
    ]));
    host.appendChild(el(`<details class="notice" style="margin-bottom:22px">
      <summary><strong>Why these are counts, not quantities</strong></summary>
      <div>Quantities mix units of measure across materials, so a portfolio-wide quantity total
      would not be a real number. Quantities are shown per row in the table below, where a single
      unit applies.</div></details>`));

    const dlBar = el('<div class="rail" style="margin-bottom:14px"></div>');
    dlBar.appendChild(el(`<span class="hint" style="align-self:center; margin:0">
      Estimated Delivery Date follows the PO created date (as SiteSense's Orders page shows it) unless
      overridden here; Promised Delivery Date is entered here only - see the notice below the table.
      ${!SERVER ? '' : IS_ADMIN ? 'Your edits save for everyone straight away.' : 'Only an admin can change these dates.'}</span>`));
    // On the server dates are saved for everyone per edit, so there is nothing to download.
    if (!SERVER) dlBar.appendChild(el('<div class="spacer"></div>'));
    const dl = el('<button class="btn btn-quiet">Download delivery_dates.json</button>');
    dl.onclick = async () => {
      const text = JSON.stringify(deliveryDates, null, 2);
      const hosted = typeof window.claude !== 'undefined' && window.claude && typeof window.claude.use === 'function';
      const was = dl.textContent;
      if (hosted) {
        const downloads = await window.claude.use('downloads');
        if (!downloads) { dl.textContent = 'Saving unavailable here'; }
        else {
          try { await downloads.save({ filename: 'delivery_dates.json', data: text }); dl.textContent = 'Saved'; }
          catch (err) { dl.textContent = err && err.code === 'declined' ? 'Cancelled' : 'Save failed'; }
        }
        setTimeout(() => { dl.textContent = was; }, 2400);
        return;
      }
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
      a.download = 'delivery_dates.json';
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    };
    if (!SERVER) dlBar.appendChild(dl);
    host.appendChild(dlBar);

    const byType = {}, byProject = {};
    rows.forEach(r => {
      const t = matType(r[1]) || '(untyped)';
      byType[t] = (byType[t] || 0) + 1;
      byProject[PROJ[r[0]]] = (byProject[PROJ[r[0]]] || 0) + 1;
    });
    const top = (o, n) => Object.entries(o).sort((a, b) => b[1] - a[1]).slice(0, n)
      .map(([label, value]) => ({ label, value }));

    host.appendChild(chartPair(
      { title: 'Stock lines by project', hint: 'Number of material records held, not quantity. Click a bar to filter.',
        rows: top(byProject, 9),
        opts: { aria: 'Stock lines by project', pick: r => { pickProject(r.label); render(); } } },
      { title: 'Stock lines by material type', hint: 'Click a bar to filter.',
        rows: top(byType, 9),
        opts: { color: cvar('--s3'), padL: 150, aria: 'Stock lines by material type',
                pick: r => { pickValue(invState, 'type', r.label); render(); } } }));

    const stockDot = r => {
      if (r[INV.AV] > 0) return `<span class="dot dot-ok">${nf(r[INV.AV])}</span>`;
      if (r[INV.O] - r[INV.RC] > 0) return `<span class="dot dot-warn">${nf(r[INV.AV])}</span>`;
      return `<span class="dot">${nf(r[INV.AV])}</span>`;
    };

    host.appendChild(block('Stock by material', 'One row per material per project, matching the SiteSense Inventory report.',
      dataTable([
        { label: 'Material', value: r => matName(r[1]),
          cell: r => `<span class="clip" title="${esc(matName(r[1]))}">${esc(matName(r[1]))}</span>` +
                     (matDesc(r[1]) ? `<span class="sub clip clip-wide" title="${esc(matDesc(r[1]))}">${esc(matDesc(r[1]))}</span>` : '') },
        { label: 'PO number', value: r => S(r[INV.PO]),
          cell: r => S(r[INV.PO]) ? `<span class="clip" title="${esc(S(r[INV.PO]))}">${esc(S(r[INV.PO]))}</span>` : '<span class="zero">not linked</span>' },
        { label: 'PO description', value: r => S(r[INV.PODESC]),
          cell: r => `<span class="clip clip-wide" title="${esc(S(r[INV.PODESC]))}">${esc(S(r[INV.PODESC]) || '—')}</span>` },
        { label: 'UOM', value: r => matUom(r[1]) },
        { label: 'Required', value: r => r[INV.R], num: true, cell: r => r[INV.R] ? nf(r[INV.R]) : '<span class="zero">0</span>' },
        { label: 'Ordered', value: r => r[INV.O], num: true, cell: r => r[INV.O] ? nf(r[INV.O]) : '<span class="zero">0</span>' },
        { label: 'Received', value: r => r[INV.RC], num: true, cell: r => r[INV.RC] ? nf(r[INV.RC]) : '<span class="zero">0</span>' },
        { label: 'Pending to come', value: r => r[INV.O] - r[INV.RC], num: true,
          cell: r => { const v = r[INV.O] - r[INV.RC]; return v > 0 ? nf(v) : '<span class="zero">0</span>'; } },
        { label: 'Issued', value: r => r[INV.IS], num: true, cell: r => r[INV.IS] ? nf(r[INV.IS]) : '<span class="zero">0</span>' },
        { label: 'Available', value: r => r[INV.AV], num: true, cell: stockDot },
        { label: 'On hand', value: r => r[INV.OH], num: true, cell: r => nf(r[INV.OH]) },
        { label: 'Est. delivery date', value: r => deliveryDateOf(r[1], 'estimated') || localDate(S(r[INV.ESTD])),
          cell: r => {
            const manual = deliveryDateOf(r[1], 'estimated');
            const shown = manual || localDate(S(r[INV.ESTD]));
            const title = manual ? 'Entered by hand on this dashboard'
              : shown ? 'From the PO created date, as SiteSense’s Orders page shows it. Pick a date to override.'
              : 'No PO linked to this stock line';
            return `<input type="date" class="deliv-pick${manual ? '' : ' deliv-default'}" data-m="${r[1]}" data-field="estimated" value="${shown}" title="${title}"${IS_ADMIN ? '' : ' disabled'}>`;
          } },
        { label: 'Promised delivery date', value: r => deliveryDateOf(r[1], 'promised'),
          cell: r => `<input type="date" class="deliv-pick" data-m="${r[1]}" data-field="promised" value="${deliveryDateOf(r[1], 'promised')}"${IS_ADMIN ? '' : ' disabled'}>` },
        { label: 'Location received into', value: r => receivedLoc(r[0], r[1]),
          cell: r => { const v = receivedLoc(r[0], r[1]); return v ? `<span class="clip" title="${esc(v)}">${esc(v)}</span>` : '<span class="zero">—</span>'; } },
        { label: 'Checked by', value: r => receivedBy(r[0], r[1]),
          cell: r => esc(receivedBy(r[0], r[1])) || '<span class="zero">—</span>' },
      ], rows, { sortAt: 9, exportName: 'Inventory',
        onRepaint: sc => sc.querySelectorAll('.deliv-pick').forEach(inp => {
          inp.onchange = () => { setDeliveryDate(+inp.dataset.m, inp.dataset.field, inp.value); saveDeliveryDates(); };
        }) })));

    host.appendChild(el(`<p class="notice" style="margin-top:14px">
      <strong>Estimated Delivery Date is derived; Promised Delivery Date is entered by hand.</strong>
      SiteSense's Orders page shows Estimated Delivery Date equal to the PO's created date on every PO
      checked, and the API exposes no separate field for it, so the dashed dates here come from the most
      recent PO on each stock line. Pick a date to override one (it then shows solid). Promised Delivery
      Date has no source in the API and is blank until entered. ${SERVER
        ? 'Dates are shared: an admin\'s edit shows for everyone on their next page load.'
        : 'Edits are remembered in this browser; to survive the next refresh, click <em>Download delivery_dates.json</em> above and save it into the dashboard folder, replacing the file there.'}</p>`));
  }
  render();
}

// ================================================================ TAB: Storage
// storage row: [p, m, locIdx, condIdx, qty]
const stoState = {};

function tabStorage(stage) {
  const st = stoState;

  const passes = (r, skip) => {
    if (!inScope(r[0])) return false;
    if (skip !== 'loc' && st.loc && S(r[2]) !== st.loc) return false;
    if (skip !== 'cond' && st.cond && S(r[3]) !== st.cond) return false;
    if (skip !== 'type' && st.type && matType(r[1]) !== st.type) return false;
    if (skip !== 'q') {
      const q = (st.q || '').toLowerCase();
      if (q && !(matName(r[1]).toLowerCase().includes(q) || matDesc(r[1]).toLowerCase().includes(q))) return false;
    }
    return true;
  };
  const optsFor = (key, get) => uniqSorted(D.storage.filter(r => passes(r, key)).map(get));

  const rail = buildRail([
    { key: 'q', type: 'search', label: 'Material', placeholder: 'Name or description' },
    { key: 'loc', type: 'select', label: 'Location', anyLabel: 'All locations',
      options: () => optsFor('loc', r => S(r[2])) },
    { key: 'cond', type: 'select', label: 'Condition', anyLabel: 'Any condition',
      options: () => optsFor('cond', r => S(r[3])) },
    { key: 'type', type: 'select', label: 'Material type', anyLabel: 'All types',
      options: () => optsFor('type', r => matType(r[1])) },
  ], st, () => render());
  stage.appendChild(rail);
  const host = el('<div></div>');
  stage.appendChild(host);

  const LABELS = { q: 'Material', loc: 'Location', cond: 'Condition', type: 'Type' };

  function render() {
    rail.sync();
    const rows = D.storage.filter(r => passes(r));

    host.textContent = '';
    const chips = activeChips(stoState, LABELS, render);
    if (chips) host.appendChild(chips);
    if (!rows.length) { host.appendChild(el('<p class="notice">No stored stock matches these filters.</p>')); return; }

    const flagged = rows.filter(r => !['Pass', 'Checked'].includes(S(r[3]))).length;
    host.appendChild(strip([
      { label: 'Stored lines', value: nf(rows.length) },
      { label: 'Locations', value: nf(new Set(rows.map(r => r[2])).size) },
      { label: 'Distinct materials', value: nf(new Set(rows.map(r => r[1])).size) },
      { label: 'Projects', value: nf(new Set(rows.map(r => r[0])).size) },
      { label: 'Not passed', value: nf(flagged), flag: flagged > 0 },
    ]));

    // Counted, not summed: stored quantities mix units of measure between rows.
    const byLoc = {}, byCond = {};
    rows.forEach(r => {
      byLoc[S(r[2])] = (byLoc[S(r[2])] || 0) + 1;
      byCond[S(r[3]) || 'Unchecked'] = (byCond[S(r[3]) || 'Unchecked'] || 0) + 1;
    });
    const top = (o, n) => Object.entries(o).sort((a, b) => b[1] - a[1]).slice(0, n).map(([label, value]) => ({ label, value }));

    host.appendChild(chartPair(
      { title: 'Stored lines by location', hint: 'Number of material records held at each location. Click a bar to filter.',
        rows: top(byLoc, 9),
        opts: { padL: 200, aria: 'Stored lines by location',
                pick: r => { pickValue(stoState, 'loc', r.label); render(); } } },
      { title: 'Stored lines by condition', hint: 'Click a bar to filter.',
        rows: top(byCond, 9),
        opts: { color: cvar('--s4'), padL: 120, aria: 'Stored lines by condition',
                pick: r => { pickValue(stoState, 'cond', r.label); render(); } } }));

    const condCell = r => {
      const c = S(r[3]);
      const cls = c === 'Pass' || c === 'Checked' ? 'dot-ok'
                : (c === 'Damage' || c === 'Fail') ? 'dot-alert'
                : c ? 'dot-warn' : '';
      return `<span class="dot ${cls}">${esc(c || 'Unchecked')}</span>`;
    };

    host.appendChild(block('Stored material detail', 'One row per material per location, matching the SiteSense Storage report.',
      dataTable([
        { label: 'Resource', value: r => matName(r[1]),
          cell: r => `<span class="clip" title="${esc(matName(r[1]))}">${esc(matName(r[1]))}</span>` +
                     (matDesc(r[1]) ? `<span class="sub clip clip-wide" title="${esc(matDesc(r[1]))}">${esc(matDesc(r[1]))}</span>` : '') },
        { label: 'Location', value: r => S(r[2]),
          cell: r => `<span class="clip" title="${esc(S(r[2]))}">${esc(S(r[2]))}</span>` },
        { label: 'Project', value: r => PROJ[r[0]],
          cell: r => `<span class="clip" title="${esc(PROJ[r[0]])}">${esc(PROJ[r[0]])}</span>` },
        { label: 'Quantity', value: r => r[4], num: true, cell: r => nf(r[4]) },
        { label: 'UOM', value: r => matUom(r[1]) },
        { label: 'Status', value: r => S(r[3]), cell: condCell },

// ================================================================ TAB: FIM (Free Issue Material)
// fim row: [p, m, loc, container, workPackage, qty, status, received, issued, available]
const F = { LOC: 2, CON: 3, WP: 4, QTY: 5, ST: 6, RCV: 7, ISS: 8, AVL: 9 };
const FIM_STOCK_TESTS = {
  'Available on site': r => r[F.AVL] > 0,
  'Received': r => r[F.RCV] > 0,
  'Issued': r => r[F.ISS] > 0,
  'Registered, nothing received': r => !r[F.RCV] && !r[F.AVL] && !r[F.QTY],
};
const fimState = {};

function tabFim(stage) {
  const st = fimState;
  const DATA = D.fim || [];

  const passes = (r, skip) => {
    if (!inScope(r[0])) return false;
    if (skip !== 'loc' && st.loc && S(r[F.LOC]) !== st.loc) return false;
    if (skip !== 'wp' && st.wp && S(r[F.WP]) !== st.wp) return false;
    if (skip !== 'status' && st.status && S(r[F.ST]) !== st.status) return false;
    if (skip !== 'con' && st.con === 'In a container' && !S(r[F.CON])) return false;
    if (skip !== 'con' && st.con === 'Loose' && S(r[F.CON])) return false;
    if (skip !== 'stock' && st.stock && !FIM_STOCK_TESTS[st.stock](r)) return false;
    if (skip !== 'q') {
      const q = (st.q || '').toLowerCase();
      if (q && !(matName(r[1]).toLowerCase().includes(q) || matDesc(r[1]).toLowerCase().includes(q)
                 || S(r[F.CON]).toLowerCase().includes(q) || S(r[F.WP]).toLowerCase().includes(q))) return false;
    }
    return true;
  };
  const optsFor = (key, get) => uniqSorted(DATA.filter(r => passes(r, key)).map(get));

  const rail = buildRail([
    { key: 'q', type: 'search', label: 'Part, container or work package', placeholder: 'Search FIM' },
    { key: 'wp', type: 'select', label: 'Work package', anyLabel: 'All work packages',
      options: () => optsFor('wp', r => S(r[F.WP])) },
    { key: 'loc', type: 'select', label: 'Location', anyLabel: 'All locations',
      options: () => optsFor('loc', r => S(r[F.LOC])) },
    { key: 'status', type: 'select', label: 'Status', anyLabel: 'Any status',
      options: () => optsFor('status', r => S(r[F.ST])) },
    { key: 'con', type: 'select', label: 'Container', anyLabel: 'Any',
      options: () => {
        const base = DATA.filter(r => passes(r, 'con'));
        return ['In a container', 'Loose'].filter(v =>
          base.some(r => v === 'In a container' ? S(r[F.CON]) : !S(r[F.CON])));
      } },
    { key: 'stock', type: 'select', label: 'Stock state', anyLabel: 'Any state',
      options: () => {
        const base = DATA.filter(r => passes(r, 'stock'));
        return Object.keys(FIM_STOCK_TESTS).filter(k => base.some(FIM_STOCK_TESTS[k]));
      } },
  ], st, () => render());
  stage.appendChild(rail);
  const host = el('<div></div>');
  stage.appendChild(host);

  const LABELS = { q: 'Search', wp: 'Work package', loc: 'Location', status: 'Status',
                   con: 'Container', stock: 'Stock state' };

  function render() {
    rail.sync();
    const rows = DATA.filter(r => passes(r));

    host.textContent = '';
    const chips = activeChips(st, LABELS, render);
    if (chips) host.appendChild(chips);

    if (!DATA.length) {
      host.appendChild(emptyNotice('free issue material'));
      return;
    }
    if (!rows.length) { host.appendChild(el('<p class="notice">No FIM matches these filters.</p>')); return; }

    const containers = new Set(rows.map(r => S(r[F.CON])).filter(Boolean));
    // Received, issued and available are per part per project, so they are counted
    // once per part rather than summed over every location the part appears in.
    const byPart = new Map();
    rows.forEach(r => { const k = r[0] + ':' + r[1]; if (!byPart.has(k)) byPart.set(k, r); });
    const parts = [...byPart.values()];
    const sum = k => parts.reduce((a, r) => a + r[k], 0);

    const awaiting = parts.filter(r => !r[F.RCV] && !r[F.AVL] && !r[F.QTY]).length;
    host.appendChild(strip([
      { label: 'FIM rows', value: nf(rows.length) },
      { label: 'Distinct parts', value: nf(parts.length) },
      { label: 'Containers', value: nf(containers.size) },
      { label: 'Locations', value: nf(new Set(rows.map(r => S(r[F.LOC])).filter(Boolean)).size) },
      { label: 'Received', value: nf(sum(F.RCV)) },
      { label: 'Issued', value: nf(sum(F.ISS)) },
      { label: 'Available', value: nf(sum(F.AVL)) },
      { label: 'Nothing received', value: nf(awaiting), flag: awaiting > 0 },
      { label: 'Work packages', value: nf(new Set(rows.map(r => S(r[F.WP])).filter(Boolean)).size) },
    ]));

    host.appendChild(el(`<p class="notice" style="margin-bottom:22px"><strong>What counts as FIM.</strong>
      A part is free issue material when its work package name begins with <em>FIM</em>, which is the
      naming convention the projects use when loading client supplied material into SiteSense. Parts
      on other work packages, such as Consumables General or LV Cables, are normal procurement and are
      not included. Received, issued and available are per part, so they are counted once even where a
      part sits in several locations or containers.</p>`));

    const byWp = {}, byLoc = {};
    rows.forEach(r => {
      const w = S(r[F.WP]) || '(none recorded)';
      byWp[w] = (byWp[w] || 0) + 1;
      const l = S(r[F.LOC]) || '(no tracked location)';
      byLoc[l] = (byLoc[l] || 0) + 1;
    });
    const top = (o, n) => Object.entries(o).sort((a, b) => b[1] - a[1]).slice(0, n).map(([label, value]) => ({ label, value }));

    host.appendChild(chartPair(
      { title: 'FIM rows by work package', hint: 'Click a bar to filter.',
        rows: top(byWp, 9),
        opts: { padL: 210, aria: 'FIM by work package',
                pick: r => { pickValue(st, 'wp', r.label === '(none recorded)' ? '' : r.label); render(); } } },
      { title: 'FIM rows by location', hint: 'Click a bar to filter.',
        rows: top(byLoc, 9),
        opts: { color: cvar('--s3'), padL: 210, aria: 'FIM by location',
                pick: r => { pickValue(st, 'loc', r.label === '(no tracked location)' ? '' : r.label); render(); } } }));

    const statusCell = r => {
      const c = S(r[F.ST]);
      const cls = ['Pass', 'Checked'].includes(c) ? 'dot-ok'
                : ['Damage', 'Fail'].includes(c) ? 'dot-alert' : c ? 'dot-warn' : '';
      return `<span class="dot ${cls}">${esc(c || 'Not recorded')}</span>`;
    };

    host.appendChild(block('Free issue material', 'One row per part per location and container.',
      dataTable([
        { label: 'Location', value: r => S(r[F.LOC]),
          cell: r => `<span class="clip" title="${esc(S(r[F.LOC]))}">${esc(S(r[F.LOC]) || 'Not located')}</span>` },
        { label: 'Container', value: r => S(r[F.CON]),
          cell: r => S(r[F.CON]) ? `<span class="clip" title="${esc(S(r[F.CON]))}">${esc(S(r[F.CON]))}</span>`
                                 : '<span class="zero">loose</span>' },
        { label: 'Part name', value: r => matName(r[1]),
          cell: r => `<span class="clip clip-wide" title="${esc(matName(r[1]))}">${esc(matName(r[1]))}</span>` },
        { label: 'Part description', value: r => matDesc(r[1]),
          cell: r => matDesc(r[1]) ? `<span class="clip clip-wide" title="${esc(matDesc(r[1]))}">${esc(matDesc(r[1]))}</span>`
                                   : '<span class="zero">—</span>' },
        { label: 'Work package', value: r => S(r[F.WP]),
          cell: r => S(r[F.WP]) ? `<span class="clip" title="${esc(S(r[F.WP]))}">${esc(S(r[F.WP]))}</span>`
                                : '<span class="zero">none</span>' },
        { label: 'Qty', value: r => r[F.QTY], num: true, cell: r => nf(r[F.QTY]) },
        { label: 'UOM', value: r => matUom(r[1]) },
        { label: 'Status', value: r => S(r[F.ST]), cell: statusCell },
        { label: 'Received', value: r => r[F.RCV], num: true,
          cell: r => r[F.RCV] ? nf(r[F.RCV]) : '<span class="zero">0</span>' },
        { label: 'Issued', value: r => r[F.ISS], num: true,
          cell: r => r[F.ISS] ? nf(r[F.ISS]) : '<span class="zero">0</span>' },
        { label: 'Available', value: r => r[F.AVL], num: true,
          cell: r => r[F.AVL] > 0 ? `<span class="dot dot-ok">${nf(r[F.AVL])}</span>` : '<span class="zero">0</span>' },
        { label: 'Project', value: r => PROJ[r[0]],
          cell: r => `<span class="clip" title="${esc(PROJ[r[0]])}">${esc(PROJ[r[0]])}</span>` },
      ], rows, { sortAt: 0, sortDir: 1, exportName: 'FIM' })));
  }
  render();
}

// ================================================================ TAB: Asset Tracking
// asset row: [p, m, costIdx, typeIdx, ordered, received, issued, returned, unitCost, posIdx, receiptsIdx]
const A = { COST: 2, TYPE: 3, ORD: 4, RCV: 5, ISS: 6, RET: 7, UC: 8, PO: 9, RCPT: 10 };
const astState = {};

const FULFIL_TESTS = {
  'Outstanding': r => r[A.ORD] - r[A.RCV] > 0,
  'Fully received': r => r[A.ORD] > 0 && r[A.ORD] - r[A.RCV] <= 0,
  'Over received': r => r[A.ORD] - r[A.RCV] < 0,
  'Issued for installation': r => r[A.ISS] > 0,
  'Returned to vendor': r => r[A.RET] > 0,
};

function tabAssets(stage) {
  const st = astState;

  /* One predicate drives both the visible rows and the dropdown contents.
     `skip` leaves out a single filter so that a dropdown still offers its own
     alternatives instead of collapsing to the value already chosen. */
  const passes = (r, skip) => {
    if (!inScope(r[0])) return false;
    if (skip !== 'cost' && st.cost && S(r[A.COST]) !== st.cost) return false;
    if (skip !== 'itype' && st.itype && S(r[A.TYPE]) !== st.itype) return false;
    if (skip !== 'q') {
      const q = (st.q || '').toLowerCase();
      if (q && !(matName(r[1]).toLowerCase().includes(q) || matDesc(r[1]).toLowerCase().includes(q)
                 || S(r[A.PO]).toLowerCase().includes(q))) return false;
    }
    if (skip !== 'fulfil' && st.fulfil && FULFIL_TESTS[st.fulfil] && !FULFIL_TESTS[st.fulfil](r)) return false;
    return true;
  };
  const optsFor = (key, get) => uniqSorted(D.assets.filter(r => passes(r, key)).map(get));

  const rail = buildRail([
    { key: 'q', type: 'search', label: 'Part or PO', placeholder: 'Part, description or PO number' },
    { key: 'cost', type: 'select', label: 'Cost code', anyLabel: 'All cost codes',
      options: () => optsFor('cost', r => S(r[A.COST])) },
    { key: 'itype', type: 'select', label: 'Line item type', anyLabel: 'All line types',
      options: () => optsFor('itype', r => S(r[A.TYPE])) },
    { key: 'fulfil', type: 'select', label: 'Fulfilment', anyLabel: 'Any',
      options: () => {
        const base = D.assets.filter(r => passes(r, 'fulfil'));
        return Object.keys(FULFIL_TESTS).filter(k => base.some(FULFIL_TESTS[k]));
      } },
  ], st, () => render());
  stage.appendChild(rail);
  const host = el('<div></div>');
  stage.appendChild(host);

  const LABELS = { q: 'Search', cost: 'Cost code', itype: 'Line type', fulfil: 'Fulfilment' };

  function render() {
    rail.sync();
    const rows = D.assets.filter(r => passes(r));

    host.textContent = '';
    const chips = activeChips(astState, LABELS, render);
    if (chips) host.appendChild(chips);
    if (!rows.length) { host.appendChild(el('<p class="notice">No parts match these filters.</p>')); return; }

    /* Every headline below is a COUNT of parts or a DOLLAR value. Both are
       additive. Raw quantities are not: one row may be metres of cable and the
       next a lump sum, so summing them portfolio-wide is meaningless. Quantities
       stay in the table where each row carries a single unit. */
    const ordered = rows.filter(r => r[A.ORD] > 0);
    const complete = ordered.filter(r => r[A.ORD] - r[A.RCV] <= 0 && r[A.RCV] > 0);
    const shortRows = rows.filter(r => r[A.ORD] - r[A.RCV] > 0);
    const over = rows.filter(r => r[A.ORD] - r[A.RCV] < 0);
    const openValue = shortRows.reduce((a, r) => a + (r[A.ORD] - r[A.RCV]) * r[A.UC], 0);

    host.appendChild(strip([
      { label: 'Parts tracked', value: nf(rows.length) },
      { label: 'Fully received', value: nf(complete.length) },
      { label: 'Parts received', value: ordered.length ? (complete.length / ordered.length * 100).toFixed(1) : '0.0', unit: '%' },
      { label: 'Outstanding', value: nf(shortRows.length), flag: shortRows.length > 0 },
      { label: 'Over received', value: nf(over.length) },
      { label: 'Parts issued', value: nf(rows.filter(r => r[A.ISS] > 0).length) },
      { label: 'Parts returned', value: nf(rows.filter(r => r[A.RET] > 0).length) },
    ]));

    const notes = el('<div class="notes"></div>');
    notes.appendChild(el(`<details class="notice"><summary><strong>Reading this tab</strong></summary>
      <div>Figures are joined on the material record, the only key shared by purchase orders, receipts,
      issue tickets and return notices. Headline figures count parts rather than summing quantities,
      because quantities mix units of measure across rows. Use the <em>Line item type</em> filter to
      separate physical materials from services, hire and lump sum lines, which are ordered but never
      received into stock and would otherwise read as permanently outstanding.</div></details>`));

    /* Open value is deliberately NOT a headline figure. Unit costs in the source
       data are not consistently per-unit: several cable lines carry a per-drum
       price against a quantity in metres, which inflates value by orders of
       magnitude. Value is shown per row instead, beside quantity, unit and unit
       cost, so it can be judged rather than trusted blindly. */
    const rank = [...rows].map(r => Math.max(0, r[A.ORD] - r[A.RCV]) * (r[A.UC] || 0)).sort((a, b) => b - a);
    const top10Share = rank.length && openValue > 0
      ? (rank.slice(0, 10).reduce((a, v) => a + v, 0) / openValue * 100).toFixed(0) : '0';
    notes.appendChild(el(`<details class="notice"><summary><strong>Open order value:
      $${nf(Math.round(openValue))}, indicative only</strong></summary>
      <div>Unit costs are not reliably per-unit in the source data. Several cable lines carry what looks
      like a per-drum or per-reel price against a quantity in metres, which inflates their value by
      orders of magnitude. The ten largest rows alone account for ${top10Share}% of this figure.
      Sort the table by <em>Open value</em> to review the biggest contributors, and check
      <em>Unit cost</em> against <em>Unit</em> before relying on any total. Correcting these in
      Procore would make this figure dependable.</div></details>`));
    host.appendChild(notes);

    // Counting outstanding parts per cost code is robust to the unit cost problem
    // described above; the value view sits beside it for review, not for totals.
    const byCost = {};
    rows.forEach(r => {
      if (r[A.ORD] - r[A.RCV] <= 0) return;
      const c = S(r[A.COST]) || '(no cost code)';
      byCost[c] = (byCost[c] || 0) + 1;
    });
    const topCost = Object.entries(byCost).sort((a, b) => b[1] - a[1]).slice(0, 10)
      .map(([label, value]) => ({ label, value, note: 'Parts outstanding' }));

    const topValue = rows.map(r => ({
        label: matName(r[1]),
        value: Math.round(Math.max(0, r[A.ORD] - r[A.RCV]) * (r[A.UC] || 0)),
        note: `${PROJ[r[0]]}\n${nf(r[A.ORD] - r[A.RCV])} ${matUom(r[1])} outstanding at $${nf(r[A.UC])} per ${matUom(r[1]) || 'unit'}`,
      })).filter(x => x.value > 0).sort((a, b) => b.value - a.value).slice(0, 12);

    host.appendChild(chartPair(
      { title: 'Outstanding parts by cost code',
        hint: 'Counted, so it is unaffected by unit cost errors. Click a bar to filter.',
        rows: topCost,
        opts: { color: cvar('--s8'), padL: 220, aria: 'Outstanding parts by cost code',
                pick: r => { pickValue(astState, 'cost', r.label === '(no cost code)' ? '' : r.label); render(); } } },
      { title: 'Largest open value by part',
        hint: 'Review these first. Hover to check quantity against unit cost, click to isolate the part.',
        rows: topValue,
        opts: { color: cvar('--s2'), padL: 180, aria: 'Open value by part',
                pick: r => { pickValue(astState, 'q', r.label); render(); } } }));

    const gapCell = r => {
      const g = r[A.ORD] - r[A.RCV];
      if (g > 0) return `<span class="short">${nf(g)}</span>`;
      if (g < 0) return `<span class="dot dot-warn">${nf(g)}</span>`;
      return `<span class="zero">0</span>`;
    };

      dataTable([

                     (matDesc(r[1]) ? `<span class="sub clip clip-wide" title="${esc(matDesc(r[1]))}">${esc(matDesc(r[1]))}</span>` : '') },
        { label: 'Project', value: r => PROJ[r[0]],
          cell: r => `<span class="clip" title="${esc(PROJ[r[0]])}">${esc(PROJ[r[0]])}</span>` },
        { label: 'Receipts', value: r => S(r[A.RCPT]),
          cell: r => `<span class="clip" title="${esc(S(r[A.RCPT]))}">${esc(S(r[A.RCPT]) || '—')}</span>` },
        { label: 'Purchase order', value: r => S(r[A.PO]),
          cell: r => `<span class="clip" title="${esc(S(r[A.PO]))}">${esc(S(r[A.PO]) || '—')}</span>` },
        { label: 'Unit', value: r => matUom(r[1]) },
        { label: 'Order qty', value: r => r[A.ORD], num: true, cell: r => nf(r[A.ORD]) },
        { label: 'Received qty', value: r => r[A.RCV], num: true, cell: r => nf(r[A.RCV]) },
        { label: 'Outstanding', value: r => r[A.ORD] - r[A.RCV], num: true, cell: gapCell },
        { label: 'Unit cost', value: r => r[A.UC], num: true,
          cell: r => r[A.UC] ? '$' + nf(r[A.UC]) : '<span class="zero">n/a</span>' },
        { label: 'Open value', value: r => Math.max(0, r[A.ORD] - r[A.RCV]) * (r[A.UC] || 0), num: true,
          cell: r => { const v = Math.max(0, r[A.ORD] - r[A.RCV]) * (r[A.UC] || 0);
                       return v ? '$' + nf(Math.round(v)) : '<span class="zero">0</span>'; } },
        { label: 'Returned to vendor', value: r => r[A.RET], num: true, cell: r => r[A.RET] ? nf(r[A.RET]) : '<span class="zero">0</span>' },
        { label: 'Issued for install', value: r => r[A.ISS], num: true, cell: r => r[A.ISS] ? nf(r[A.ISS]) : '<span class="zero">0</span>' },
      ], rows, { sortAt: 8, exportName: 'Asset_Tracking' })));
  }
  render();
}

// ================================================================ TAB: Receipts
// receipt row: [p, m, receipt, docStatus, cond, loc, checkedBy, shipment, po,
//               costCode, itemType, qty, unitCost, date, month, lineNo, poDesc, poDate]
const R = { DOC: 2, ST: 3, COND: 4, LOC: 5, BY: 6, SHIP: 7, PO: 8, COST: 9,
            TYPE: 10, QTY: 11, UC: 12, DATE: 13, MONTH: 14, LINE: 15, PODESC: 16, PODATE: 17 };
const recState = {};

function tabReceipts(stage) {
  const st = recState;
  const DATA = D.receipts || [];

  const passes = (r, skip) => {
    if (!inScope(r[0])) return false;
    if (skip !== 'status' && st.status && S(r[R.ST]) !== st.status) return false;
    if (skip !== 'cond' && st.cond && S(r[R.COND]) !== st.cond) return false;
    if (skip !== 'loc' && st.loc && S(r[R.LOC]) !== st.loc) return false;
    if (skip !== 'by' && st.by && S(r[R.BY]) !== st.by) return false;
    if (skip !== 'month' && st.month && S(r[R.MONTH]) !== st.month) return false;
    if (skip !== 'q') {
      const q = (st.q || '').toLowerCase();
      if (q && !(matName(r[1]).toLowerCase().includes(q) || matDesc(r[1]).toLowerCase().includes(q)
                 || S(r[R.DOC]).toLowerCase().includes(q) || S(r[R.PO]).toLowerCase().includes(q)
                 || S(r[R.SHIP]).toLowerCase().includes(q))) return false;
    }
    return true;
  };
  const optsFor = (key, get) => uniqSorted(DATA.filter(r => passes(r, key)).map(get));

  const rail = buildRail([
    { key: 'q', type: 'search', label: 'Receipt, part, PO or shipment', placeholder: 'Search any reference' },
    { key: 'status', type: 'select', label: 'Document status', anyLabel: 'Any status',
      options: () => optsFor('status', r => S(r[R.ST])) },
    { key: 'cond', type: 'select', label: 'Receipt status', anyLabel: 'Any status',
      options: () => optsFor('cond', r => S(r[R.COND])) },
    { key: 'loc', type: 'select', label: 'Storage location', anyLabel: 'All locations',
      options: () => optsFor('loc', r => S(r[R.LOC])) },
    { key: 'by', type: 'select', label: 'Checked by', anyLabel: 'Anyone',
      options: () => optsFor('by', r => S(r[R.BY])) },
    { key: 'month', type: 'select', label: 'Month received', anyLabel: 'All months',
      options: () => optsFor('month', r => S(r[R.MONTH])) },
  ], st, () => render());
  stage.appendChild(rail);
  const host = el('<div></div>');
  stage.appendChild(host);

  const LABELS = { q: 'Search', status: 'Status', cond: 'Receipt status', loc: 'Location',
                   by: 'Checked by', month: 'Month' };

  function render() {
    rail.sync();
    const rows = DATA.filter(r => passes(r));

    host.textContent = '';
    const chips = activeChips(st, LABELS, render);
    if (chips) host.appendChild(chips);
    if (!DATA.length) {
      host.appendChild(emptyNotice('receipt detail'));
      return;
    }
    if (!rows.length) { host.appendChild(el('<p class="notice">No receipt lines match these filters.</p>')); return; }

    const notPassed = rows.filter(r => !['Pass', 'Checked'].includes(S(r[R.COND]))).length;
    const noPo = rows.filter(r => !S(r[R.PO])).length;
    const value = rows.reduce((a, r) => a + r[R.QTY] * (r[R.UC] || 0), 0);
    host.appendChild(strip([
      { label: 'Receipt lines', value: nf(rows.length) },
      { label: 'Receipts', value: nf(new Set(rows.map(r => r[R.DOC])).size) },
      { label: 'Distinct parts', value: nf(new Set(rows.map(r => r[1])).size) },
      { label: 'Received value', value: '$' + nf(Math.round(value)) },
      { label: 'Not passed', value: nf(notPassed), flag: notPassed > 0 },
      { label: 'No PO linked', value: nf(noPo), flag: noPo > 0 },
    ]));

    const months = [...new Set(rows.map(r => S(r[R.MONTH])).filter(Boolean))].sort();
    const perMonth = {};
    rows.forEach(r => { const m = S(r[R.MONTH]); if (m) perMonth[m] = (perMonth[m] || 0) + 1; });
    const series = [{ label: 'Receipt lines', values: months.map(m => perMonth[m] || 0) }];
    host.appendChild(block('Receiving activity by month', 'Counted on the received date. Click a point to filter.',
      keyRow(series), lineChart(series, months, { aria: 'Receipt lines per month',
        pick: m => { pickValue(st, 'month', m); render(); } })));

    const byLoc = {}, byCond = {};
    rows.forEach(r => {
      const l = S(r[R.LOC]) || '(not recorded)';
      byLoc[l] = (byLoc[l] || 0) + 1;
      const c = S(r[R.COND]) || '(not recorded)';
      byCond[c] = (byCond[c] || 0) + 1;
    });
    const top = (o, n) => Object.entries(o).sort((a, b) => b[1] - a[1]).slice(0, n).map(([label, value]) => ({ label, value }));
    host.appendChild(chartPair(
      { title: 'Receipt lines by storage location', hint: 'Where goods were put away. Click a bar to filter.',
        rows: top(byLoc, 9),
        opts: { padL: 200, aria: 'Receipt lines by location',
                pick: r => { pickValue(st, 'loc', r.label === '(not recorded)' ? '' : r.label); render(); } } },
      { title: 'Receipt lines by receipt status', hint: 'Click a bar to filter.',
        rows: top(byCond, 9),
        opts: { color: cvar('--s4'), padL: 150, aria: 'Receipt lines by receipt status',
                pick: r => { pickValue(st, 'cond', r.label === '(not recorded)' ? '' : r.label); render(); } } }));

    const condCell = r => {
      const c = S(r[R.COND]);
      const cls = ['Pass', 'Checked'].includes(c) ? 'dot-ok'
                : ['Damage', 'Fail', 'Short'].includes(c) ? 'dot-alert'
                : c ? 'dot-warn' : '';
      return `<span class="dot ${cls}">${esc(c || 'Not recorded')}</span>`;
    };

    host.appendChild(block('Receipt detail', 'One row per receipt line, matching the SiteSense Receipt Dashboard.',
      dataTable([
        { label: 'Receipt', value: r => S(r[R.DOC]),
          cell: r => `<span class="clip" title="${esc(S(r[R.DOC]))}">${esc(S(r[R.DOC]))}</span>` },
        { label: 'Status', value: r => S(r[R.ST]) },
        { label: 'Received', value: r => S(r[R.DATE]) },
        { label: 'PO', value: r => S(r[R.PO]),
          cell: r => S(r[R.PO]) ? `<span class="clip" title="${esc(S(r[R.PO]))}">${esc(S(r[R.PO]))}</span>`
                                : '<span class="zero">not linked</span>' },
        { label: 'PO description', value: r => S(r[R.PODESC]),
          cell: r => `<span class="clip clip-wide" title="${esc(S(r[R.PODESC]))}">${esc(S(r[R.PODESC]) || '—')}</span>` },
        { label: 'PO date', value: r => S(r[R.PODATE]) },
        { label: 'Shipment', value: r => S(r[R.SHIP]),
          cell: r => `<span class="clip" title="${esc(S(r[R.SHIP]))}">${esc(S(r[R.SHIP]) || '—')}</span>` },
        { label: 'Part', value: r => matName(r[1]),
          cell: r => `<span class="clip clip-wide" title="${esc(matName(r[1]))}">${esc(matName(r[1]))}</span>`
                   + (matDesc(r[1]) ? `<span class="sub clip clip-wide" title="${esc(matDesc(r[1]))}">${esc(matDesc(r[1]))}</span>` : '') },
        { label: 'Qty', value: r => r[R.QTY], num: true, cell: r => nf(r[R.QTY]) },
        { label: 'UOM', value: r => matUom(r[1]) },
        { label: 'Receipt status', value: r => S(r[R.COND]), cell: condCell },
        { label: 'Storage location', value: r => S(r[R.LOC]),
          cell: r => `<span class="clip" title="${esc(S(r[R.LOC]))}">${esc(S(r[R.LOC]) || '—')}</span>` },
        { label: 'Checked by', value: r => S(r[R.BY]) },
        { label: 'Cost code', value: r => S(r[R.COST]),
          cell: r => `<span class="clip" title="${esc(S(r[R.COST]))}">${esc(S(r[R.COST]) || '—')}</span>` },
        { label: 'Unit cost', value: r => r[R.UC], num: true,
          cell: r => r[R.UC] ? '$' + nf(r[R.UC]) : '<span class="zero">n/a</span>' },
        { label: 'Line value', value: r => Math.round(r[R.QTY] * (r[R.UC] || 0)), num: true,
          cell: r => { const v = r[R.QTY] * (r[R.UC] || 0); return v ? '$' + nf(Math.round(v)) : '<span class="zero">0</span>'; } },
        { label: 'Project', value: r => PROJ[r[0]],
          cell: r => `<span class="clip" title="${esc(PROJ[r[0]])}">${esc(PROJ[r[0]])}</span>` },
      ], rows, { sortAt: 2, exportName: 'Receipts' })));
  }
  render();
}

// ================================================================ TAB: Issuing
// issuing row: [p, m, issueTicket, status, request, pickTicket, requestedBy,
//               reqQty, pickedQty, issuedQty, availQty, recipient, pickLoc, dateRaised]
// The chain behind every row is Material Request -> Pick Ticket -> Issue Ticket,
// each contributing part of the picture: requested quantity off the Request,
// picked quantity and pick location off the Pick Ticket, issued quantity and
// requestor off the Issue Ticket itself. Available quantity is the material's
// current stock position, joined in from the same Inventory Counters as the
// Inventory tab, not a field stored on any of the three documents.
const ISS = { IT: 2, ST: 3, RQ: 4, PT: 5, REQBY: 6, REQQ: 7, PICKQ: 8, ISSQ: 9,
              AVAILQ: 10, RECIP: 11, LOC: 12, DATE: 13 };
const issState = {};

function tabIssuing(stage) {
  const st = issState;
  const DATA = D.issuing || [];

  const passes = (r, skip) => {
    if (!inScope(r[0])) return false;
    if (skip !== 'status' && st.status && S(r[ISS.ST]) !== st.status) return false;
    if (skip !== 'by' && st.by && S(r[ISS.REQBY]) !== st.by) return false;
    if (skip !== 'recip' && st.recip && S(r[ISS.RECIP]) !== st.recip) return false;
    if (skip !== 'loc' && st.loc && S(r[ISS.LOC]) !== st.loc) return false;
    if (skip !== 'q') {
      const q = (st.q || '').toLowerCase();
      if (q && !(matName(r[1]).toLowerCase().includes(q) || matDesc(r[1]).toLowerCase().includes(q)
                 || S(r[ISS.IT]).toLowerCase().includes(q))) return false;
    }
    return true;
  };
  const optsFor = (key, get) => uniqSorted(DATA.filter(r => passes(r, key)).map(get));

  const rail = buildRail([
    { key: 'q', type: 'search', label: 'Part or Issue Ticket', placeholder: 'Name, description or ticket number' },
    { key: 'status', type: 'select', label: 'Status', anyLabel: 'Any status',
      options: () => optsFor('status', r => S(r[ISS.ST])) },
    { key: 'by', type: 'select', label: 'Requested by', anyLabel: 'Anyone',
      options: () => optsFor('by', r => S(r[ISS.REQBY])) },
    { key: 'recip', type: 'select', label: 'Recipient', anyLabel: 'Anyone',
      options: () => optsFor('recip', r => S(r[ISS.RECIP])) },
    { key: 'loc', type: 'select', label: 'Pick location', anyLabel: 'All locations',
      options: () => optsFor('loc', r => S(r[ISS.LOC])) },
  ], st, () => render());
  stage.appendChild(rail);
  const host = el('<div></div>');
  stage.appendChild(host);

  const LABELS = { q: 'Search', status: 'Status', by: 'Requested by', recip: 'Recipient', loc: 'Pick location' };

  function render() {
    rail.sync();
    const rows = DATA.filter(r => passes(r));

    host.textContent = '';
    const chips = activeChips(st, LABELS, render);
    if (chips) host.appendChild(chips);
    if (!DATA.length) {
      host.appendChild(emptyNotice('issuing detail'));
      return;
    }
    if (!rows.length) { host.appendChild(el('<p class="notice">No issue lines match these filters.</p>')); return; }

    const shortPicked = rows.filter(r => r[ISS.PICKQ] < r[ISS.REQQ]).length;
    const noStock = rows.filter(r => r[ISS.AVAILQ] <= 0).length;
    host.appendChild(strip([
      { label: 'Issue lines', value: nf(rows.length) },
      { label: 'Issue tickets', value: nf(new Set(rows.map(r => S(r[ISS.IT]))).size) },
      { label: 'Distinct parts', value: nf(new Set(rows.map(r => r[1])).size) },
      { label: 'Picked short of requested', value: nf(shortPicked), flag: shortPicked > 0 },
      { label: 'No stock available now', value: nf(noStock), flag: noStock > 0 },
    ]));

    const byStatus = {}, byRecip = {};
    rows.forEach(r => {
      const s = S(r[ISS.ST]) || '(no status)';
      byStatus[s] = (byStatus[s] || 0) + 1;
      const rc = S(r[ISS.RECIP]) || '(not recorded)';
      byRecip[rc] = (byRecip[rc] || 0) + 1;
    });
    const top = (o, n) => Object.entries(o).sort((a, b) => b[1] - a[1]).slice(0, n).map(([label, value]) => ({ label, value }));
    host.appendChild(chartPair(
      { title: 'Issue lines by status', hint: 'Click a bar to filter.',
        rows: top(byStatus, 9),
        opts: { aria: 'Issue lines by status',
                pick: r => { pickValue(st, 'status', r.label === '(no status)' ? '' : r.label); render(); } } },
      { title: 'Issue lines by recipient', hint: 'Click a bar to filter.',
        rows: top(byRecip, 9),
        opts: { color: cvar('--s5'), padL: 150, aria: 'Issue lines by recipient',
                pick: r => { pickValue(st, 'recip', r.label === '(not recorded)' ? '' : r.label); render(); } } }));

    const qtyDot = r => `<span class="dot ${r[ISS.PICKQ] < r[ISS.REQQ] ? 'dot-warn' : 'dot-ok'}">${nf(r[ISS.PICKQ])}</span>`;

    host.appendChild(block('Issuing detail', 'One row per issue line: Material Request → Pick Ticket → Issue Ticket, matching the SiteSense Issuing Dashboard.',
      dataTable([
        { label: 'Part', value: r => matName(r[1]),
          cell: r => `<span class="clip clip-wide" title="${esc(matName(r[1]))}">${esc(matName(r[1]))}</span>`
                   + (matDesc(r[1]) ? `<span class="sub clip clip-wide" title="${esc(matDesc(r[1]))}">${esc(matDesc(r[1]))}</span>` : '') },
        { label: 'Status', value: r => S(r[ISS.ST]) },
        { label: 'Issue Ticket', value: r => S(r[ISS.IT]),
          cell: r => `<span class="clip" title="${esc(S(r[ISS.IT]))}">${esc(S(r[ISS.IT]))}</span>` },
        { label: 'Requested by', value: r => S(r[ISS.REQBY]) },
        { label: 'Requested qty', value: r => r[ISS.REQQ], num: true, cell: r => nf(r[ISS.REQQ]) },
        { label: 'Picked qty', value: r => r[ISS.PICKQ], num: true, cell: qtyDot },
        { label: 'Issued qty', value: r => r[ISS.ISSQ], num: true, cell: r => nf(r[ISS.ISSQ]) },
        { label: 'Available qty', value: r => r[ISS.AVAILQ], num: true, cell: r => nf(r[ISS.AVAILQ]) },
        { label: 'Recipient', value: r => S(r[ISS.RECIP]) },
        { label: 'Pick location', value: r => S(r[ISS.LOC]),
          cell: r => `<span class="clip" title="${esc(S(r[ISS.LOC]))}">${esc(S(r[ISS.LOC]) || '—')}</span>` },
        { label: 'Date raised', value: r => S(r[ISS.DATE]) },
        { label: 'Project', value: r => PROJ[r[0]],
          cell: r => `<span class="clip" title="${esc(PROJ[r[0]])}">${esc(PROJ[r[0]])}</span>` },
      ], rows, { sortAt: 10, sortDir: -1, exportName: 'Issuing' })));

    host.appendChild(el(`<p class="notice" style="margin-top:14px">
      <strong>"Date raised" is the Issue Ticket's own created date, not SiteSense's "Approved Date".</strong>
      SiteSense's native Issuing report shows a genuine Approved Date, but no field on this GraphQL API
      matches it for the same ticket - every timestamp on the Issue Ticket, its Pick Ticket and its
      Material Request was checked against the exact value the native report displayed. Rather than
      guess, this column uses the one date confirmed against the ticket itself.</p>`));
  }
  render();
}

// ================================================================ TABS: document ledgers
const DOMAIN_EXPORT = {
  materials_inventory: 'Materials_Documents',
  track_trace: 'Track_and_Trace_Documents',
  quality_compliance: 'Quality_Documents',
};
const LEDGER_TABS = {
  materials_inventory: { title: 'Materials & Inventory',
    lede: 'Purchase orders, receipts, deliveries and inventory audits at document level.' },
  track_trace: { title: 'Track & Trace',
    lede: 'Material requests, transfers, pick tickets and shipments, covering material movement and logistics.' },
  quality_compliance: { title: 'Field Quality & Compliance',
    lede: 'Field inspections and non-compliance tickets recorded directly in SiteSense.' },
};

function tabLedger(stage, domain) {
  const keys = Object.keys(D.ledger_types).filter(k => D.ledger_types[k].domain === domain);
  const state = {};
  const allDocs = () => keys.flatMap(k => D.ledger_types[k].docs.map(d => ({ d, k })));

  const passes = (x, skip) => {
    const d = x.d;
    if (!inScope(d[0])) return false;
    if (skip !== 'doctype' && state.doctype && D.ledger_types[x.k].label !== state.doctype) return false;
    if (skip !== 'status' && state.status && S(d[1]) !== state.status) return false;
    if (skip !== 'month' && state.month && S(d[2]) !== state.month) return false;
    if (skip !== 'q') {
      const q = (state.q || '').toLowerCase();
      if (q && !S(d[3]).toLowerCase().includes(q)) return false;
    }
    return true;
  };
  const optsFor = (key, get) => uniqSorted(allDocs().filter(x => passes(x, key)).map(get));

  const rail = buildRail([
    { key: 'q', type: 'search', label: 'Document', placeholder: 'Document number' },
    { key: 'doctype', type: 'select', label: 'Document type', anyLabel: 'All types',
      options: () => optsFor('doctype', x => D.ledger_types[x.k].label) },
    { key: 'status', type: 'select', label: 'Status', anyLabel: 'Any status',
      options: () => optsFor('status', x => S(x.d[1])) },
    { key: 'month', type: 'select', label: 'Month created', anyLabel: 'All months',
      options: () => optsFor('month', x => S(x.d[2])) },
  ], state, () => render());
  stage.appendChild(rail);
  const host = el('<div></div>');
  stage.appendChild(host);

  const LABELS = { q: 'Document', doctype: 'Type', status: 'Status', month: 'Month' };

  function render() {
    rail.sync();
    const pass = (d, k) => passes({ d, k });

    host.textContent = '';
    const chips = activeChips(state, LABELS, render);
    if (chips) host.appendChild(chips);
    const perType = keys.map(k => ({
      k, label: D.ledger_types[k].label,
      docs: D.ledger_types[k].docs.filter(d => pass(d, k)),
    }));
    const total = perType.reduce((a, t) => a + t.docs.length, 0);

    if (!total) {
      host.appendChild(el(`<p class="notice">No documents match these filters. If no projects are
        excluded, this module may simply not be in active use in SiteSense. Check whether it is
        tracked elsewhere, for example in Procore.</p>`));
      return;
    }

    host.appendChild(strip(perType.map(t => ({ label: t.label, value: nf(t.docs.length) }))));

    const withData = perType.filter(t => t.docs.length);
    const months = [...new Set(withData.flatMap(t => t.docs.map(d => S(d[2])).filter(Boolean)))].sort();
    const series = withData.map(t => {
      const c = {};
      t.docs.forEach(d => { const m = S(d[2]); if (m) c[m] = (c[m] || 0) + 1; });
      return { label: t.label, values: months.map(m => c[m] || 0) };
    });
    host.appendChild(block('Documents created each month', 'Click a point to filter to that month.',
      keyRow(series), lineChart(series, months, { aria: 'Documents per month',
        pick: m => { pickValue(state, 'month', m); render(); } })));

    const flat = withData.flatMap(t => t.docs.map(d => ({ d, type: t.label })));
    const byProject = {}, byStatus = {};
    flat.forEach(x => {
      byProject[PROJ[x.d[0]]] = (byProject[PROJ[x.d[0]]] || 0) + 1;
      byStatus[S(x.d[1])] = (byStatus[S(x.d[1])] || 0) + 1;
    });
    const top = (o, n) => Object.entries(o).sort((a, b) => b[1] - a[1]).slice(0, n).map(([label, value]) => ({ label, value }));
    host.appendChild(chartPair(
      { title: 'Documents by project', hint: 'Click a bar to filter.',
        rows: top(byProject, 9),
        opts: { aria: 'Documents by project', pick: r => { pickProject(r.label); render(); } } },
      { title: 'Documents by status', hint: 'Click a bar to filter.',
        rows: top(byStatus, 9),
        opts: { color: cvar('--s7'), padL: 150, aria: 'Documents by status',
                pick: r => { pickValue(state, 'status', r.label); render(); } } }));

    host.appendChild(block('Document register', null, dataTable([
      { label: 'Document', value: x => S(x.d[3]), cell: x => `<span class="clip" title="${esc(S(x.d[3]))}">${esc(S(x.d[3]))}</span>` },
      { label: 'Type', value: x => x.type },
      { label: 'Status', value: x => S(x.d[1]) },
      { label: 'Project', value: x => PROJ[x.d[0]], cell: x => `<span class="clip" title="${esc(PROJ[x.d[0]])}">${esc(PROJ[x.d[0]])}</span>` },
      { label: 'Updated', value: x => S(x.d[4]) },
    ], flat, { sortAt: 4, exportName: DOMAIN_EXPORT[domain] })));
  }
  render();
}

// ================================================================ TAB: Regions (configuration)
function tabRegions(stage) {
  const host = el('<div></div>');
  stage.appendChild(host);
  let dirty = false;

  function render() {
    host.textContent = '';

    const counts = { East: 0, West: 0, Unassigned: 0 };
    D.projects.forEach((p, i) => { counts[regionOf(i) || 'Unassigned']++; });
    host.appendChild(strip([
      { label: 'East coast', value: nf(counts.East) },
      { label: 'West coast', value: nf(counts.West) },
      { label: 'Unassigned', value: nf(counts.Unassigned), flag: counts.Unassigned > 0 },
      { label: 'Projects', value: nf(D.projects.length) },
    ]));

    const bar = el('<div class="rail"></div>');
    const suggest = el('<button class="btn">Fill blanks from project codes</button>');
    suggest.title = 'Sets any unassigned project whose name carries an AU-WA or AU-QLD style code';
    suggest.onclick = () => {
      let n = 0;
      D.projects.forEach((p, i) => {
        if (!regionOf(i)) { const g = suggestRegion(p.name); if (g) { regionByProject[i] = g; n++; } }
      });
      if (n) { dirty = true; saveRegions(); }
      render();
    };
    const clear = el('<button class="btn btn-quiet">Clear all assignments</button>');
    clear.onclick = () => {
      D.projects.forEach((p, i) => { regionByProject[i] = ''; });
      dirty = true; saveRegions(); render();
    };
    const dl = el('<button class="btn">Download regions.json</button>');
    dl.onclick = async () => {
      const out = {};
      D.projects.forEach((p, i) => { out[String(p.id)] = regionOf(i); });
      const text = JSON.stringify(out, null, 2);
      const hosted = typeof window.claude !== 'undefined' && window.claude && typeof window.claude.use === 'function';
      const was = dl.textContent;
      if (hosted) {
        const downloads = await window.claude.use('downloads');
        if (!downloads) { dl.textContent = 'Saving unavailable here'; }
        else {
          try { await downloads.save({ filename: 'regions.json', data: text }); dl.textContent = 'Saved'; }
          catch (err) { dl.textContent = err && err.code === 'declined' ? 'Cancelled' : 'Save failed'; }
        }
        setTimeout(() => { dl.textContent = was; }, 2400);
        return;
      }
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
      a.download = 'regions.json';
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    };
    bar.appendChild(suggest);
    bar.appendChild(clear);
    bar.appendChild(el('<div class="spacer"></div>'));
    if (!SERVER) bar.appendChild(dl);   // on the server every change is already saved for everyone
    host.appendChild(bar);

    host.appendChild(el(`<div class="notes">
      <p class="notice"><strong>Region is an RSGx overlay, not a SiteSense field.</strong>
      SiteSense holds no east or west attribute, so this mapping is maintained here and applied to
      every tab through the <em>Region</em> filter.</p>
      ${SERVER
        ? `<p class="notice"><strong>Changes are shared.</strong> Each change is saved straight away and
           applies for everyone on their next page load, and survives refreshes and redeploys.</p>`
        : `<p class="notice"><strong>${dirty ? 'You have unsaved changes for future refreshes.' : 'To keep changes permanently.'}</strong>
           Edits apply immediately and are remembered in this browser. To survive the three-hourly refresh,
           click <em>Download regions.json</em> and save it into the dashboard folder, replacing the file
           there. The next refresh reads it and bakes the regions in for everyone.</p>`}
    </div>`));

    const rows = D.projects.map((p, i) => ({ p, i }));
    host.appendChild(block('Project regions', 'Set each project to East or West. Blank means unassigned.',
      dataTable([
        { label: 'Project', value: x => x.p.name,
          cell: x => `<span class="clip clip-wide" title="${esc(x.p.name)}">${esc(x.p.name)}</span>` },
        { label: 'SiteSense ID', value: x => x.p.id, num: true },
        { label: 'Suggested', value: x => suggestRegion(x.p.name) || '',
          cell: x => { const g = suggestRegion(x.p.name);
                       return g ? esc(g) : '<span class="zero">no code</span>'; } },
        { label: 'Region', value: x => regionOf(x.i) || '',
          cell: x => `<select data-i="${x.i}" class="region-pick">
            <option value=""${regionOf(x.i) ? '' : ' selected'}>Unassigned</option>
            ${REGION_CHOICES.map(r => `<option value="${r}"${regionOf(x.i) === r ? ' selected' : ''}>${r}</option>`).join('')}
          </select>` },
      ], rows, { sortAt: 0, sortDir: 1, pageSize: 40, exportName: 'Project_Regions',
        onRepaint: sc => sc.querySelectorAll('select.region-pick').forEach(sel => {
          sel.onchange = () => {
            regionByProject[+sel.dataset.i] = sel.value;
            dirty = true;
            saveRegions();
            render();
          };
        }) })));
  }
  render();
}

// ================================================================ TAB: Users (admin, server only)
// A strong temporary password: 4 groups of 4 from an unambiguous alphabet.
function makeTempPassword() {
  const alphabet = 'abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const bytes = crypto.getRandomValues(new Uint8Array(16));
  const chars = [...bytes].map(b => alphabet[b % alphabet.length]).join('');
  return chars.match(/.{4}/g).join('-');
}

function tabUsers(stage) {
  const host = el('<div></div>');
  stage.appendChild(host);
  let users = [], catalog = [], editing = null, notice = null;
  const nameOf = id => (catalog.find(p => p.id === id) || {}).name || `Project ${id}`;

  /* A checkbox list of projects with a quick filter, used both when adding a
     user and when changing someone's projects. */
  function projectPicker(selected) {
    const chosen = new Set(selected);
    const wrap = el(`<div class="user-projects">
      <div class="user-projects-bar">
        <input type="search" placeholder="Filter projects" aria-label="Filter projects">
        <button type="button" class="btn btn-quiet" data-act="all">Select shown</button>
        <button type="button" class="btn btn-quiet" data-act="none">Clear</button>
        <span class="user-projects-count"></span>
      </div>
      <div class="user-projects-list"></div></div>`);
    const list = wrap.querySelector('.user-projects-list');
    const filter = wrap.querySelector('input');
    const count = wrap.querySelector('.user-projects-count');
    const paint = () => {
      const q = filter.value.trim().toLowerCase();
      const shown = catalog.filter(p => !q || p.name.toLowerCase().includes(q) || String(p.id).includes(q));
      list.innerHTML = shown.map(p => `<label><input type="checkbox" value="${p.id}"${chosen.has(p.id) ? ' checked' : ''}>
        <span>${esc(p.name)}</span></label>`).join('') || '<p class="empty">No projects match.</p>';
      count.textContent = `${chosen.size} selected`;
      list.querySelectorAll('input').forEach(cb => cb.onchange = () => {
        cb.checked ? chosen.add(+cb.value) : chosen.delete(+cb.value);
        count.textContent = `${chosen.size} selected`;
      });
    };
    filter.oninput = paint;
    wrap.querySelector('[data-act="all"]').onclick = () => {
      list.querySelectorAll('input').forEach(cb => chosen.add(+cb.value)); paint();
    };
    wrap.querySelector('[data-act="none"]').onclick = () => { chosen.clear(); paint(); };
    paint();
    wrap.value = () => [...chosen];
    return wrap;
  }

  async function load() {
    try {
      const r = await api('GET', '/api/users');
      users = r.users; catalog = r.projects;
    } catch (err) { host.innerHTML = `<p class="notice">Could not load users: ${esc(err.message)}</p>`; return; }
    render();
  }

  async function run(fn, success) {
    try { await fn(); if (success) toast(success, 'ok'); await load(); return true; }
    catch (err) { toast(err.message, 'error'); render(); return false; }
  }

  function render() {
    host.textContent = '';
    const admins = users.filter(u => u.role === 'admin').length;
    host.appendChild(strip([
      { label: 'Users', value: nf(users.length) },
      { label: 'Admins', value: nf(admins) },
      { label: 'Viewers', value: nf(users.length - admins) },
      { label: 'Viewers with no projects', value: nf(users.filter(u => u.role === 'viewer' && !u.projects.length).length),
        flag: users.some(u => u.role === 'viewer' && !u.projects.length) },
    ]));

    if (notice) {
      host.appendChild(el(`<div class="notice user-secret"><strong>${esc(notice.title)}</strong><br>
        Share it with them directly (not by email or chat if you can avoid it). It is shown once;
        they can change it under <em>Change password</em> after signing in.
        <code>${esc(notice.password)}</code></div>`));
    }

    // ---- add a user
    const add = el(`<section class="block user-add"><h3>Add a user</h3>
      <div class="rail">
        <div class="field"><label for="nu-name">Username</label><input id="nu-name" autocomplete="off" spellcheck="false"></div>
        <div class="field"><label for="nu-pass">Temporary password</label><input id="nu-pass" autocomplete="new-password" spellcheck="false"></div>
        <div class="field"><label>&nbsp;</label><button type="button" class="btn btn-quiet" data-act="gen">Generate</button></div>
        <div class="field"><label for="nu-role">Role</label><select id="nu-role">
          <option value="viewer">Viewer - sees assigned projects, read-only</option>
          <option value="admin">Admin - every project, manages users</option></select></div>
        <div class="spacer"></div>
        <div class="field"><label>&nbsp;</label><button type="button" class="btn btn-primary" data-act="add">Add user</button></div>
      </div>
      <div class="nu-projects"><p class="hint">Projects this viewer can see:</p></div>
    </section>`);
    const pass = add.querySelector('#nu-pass');
    const role = add.querySelector('#nu-role');
    const projWrap = add.querySelector('.nu-projects');
    const picker = projectPicker([]);
    projWrap.appendChild(picker);
    const syncRole = () => { projWrap.hidden = role.value === 'admin'; };
    role.onchange = syncRole; syncRole();
    add.querySelector('[data-act="gen"]').onclick = () => { pass.value = makeTempPassword(); };
    add.querySelector('[data-act="add"]').onclick = () => {
      const username = add.querySelector('#nu-name').value.trim(), password = pass.value;
      run(async () => {
        await api('POST', '/api/users', { username, password, role: role.value,
                                          projects: role.value === 'admin' ? [] : picker.value() });
        notice = { title: `Temporary password for ${username}:`, password };
      }, `Added ${username}`);
    };
    host.appendChild(add);

    // ---- the user list
    const me = SERVER.username.toLowerCase();
    const table = el(`<section class="block user-list"><h3>Users</h3><div class="tablewrap"><div class="tablescroll">
      <table><thead><tr><th>Username</th><th>Role</th><th>Projects</th><th></th></tr></thead><tbody></tbody></table>
      </div></div></section>`);
    const tbody = table.querySelector('tbody');
    users.forEach(u => {
      const self = u.username.toLowerCase() === me;
      const projects = u.role === 'admin' ? '<span class="zero">All projects</span>'
        : u.projects.length ? `<span title="${esc(u.projects.map(nameOf).join('\n'))}">${u.projects.length} project${u.projects.length === 1 ? '' : 's'}</span>
            <span class="sub clip">${esc(u.projects.map(nameOf).join(', '))}</span>`
        : '<span class="dot dot-alert">None assigned</span>';
      const tr = el(`<table><tbody><tr>
        <td><strong>${esc(u.username)}</strong>${self ? ' <span class="zero">(you)</span>' : ''}</td>
        <td><select class="region-pick" aria-label="Role for ${esc(u.username)}">
          ${['viewer', 'admin'].map(r => `<option value="${r}"${u.role === r ? ' selected' : ''}>${r === 'admin' ? 'Admin' : 'Viewer'}</option>`).join('')}
        </select></td>
        <td>${projects}</td>
        <td class="user-actions">
          ${u.role === 'viewer' ? '<button type="button" class="btn btn-quiet" data-act="projects">Projects</button>' : ''}
          <button type="button" class="btn btn-quiet" data-act="reset">Reset password</button>
          ${self ? '' : '<button type="button" class="btn btn-quiet btn-danger" data-act="remove">Remove</button>'}
        </td></tr></tbody></table>`).querySelector('tr');
      tr.querySelector('select').onchange = e => run(
        () => api('PUT', `/api/users/${encodeURIComponent(u.username)}`, { role: e.target.value }),
        `${u.username} is now ${e.target.value === 'admin' ? 'an admin' : 'a viewer'}`)
        // Changing your own role changes what this page should show; reload into it.
        .then(ok => { if (ok && self) location.reload(); });
      const projBtn = tr.querySelector('[data-act="projects"]');
      if (projBtn) projBtn.onclick = () => { editing = editing === u.username ? null : u.username; render(); };
      tr.querySelector('[data-act="reset"]').onclick = () => {
        if (!confirm(`Reset ${u.username}'s password? They will be signed out everywhere.`)) return;
        const password = makeTempPassword();
        run(async () => {
          await api('PUT', `/api/users/${encodeURIComponent(u.username)}`, { password });
          notice = { title: `New password for ${u.username}:`, password };
        }, `Password reset for ${u.username}`);
      };
      const rm = tr.querySelector('[data-act="remove"]');
      if (rm) rm.onclick = () => {
        if (!confirm(`Remove ${u.username}? They will lose access immediately.`)) return;
        run(() => api('DELETE', `/api/users/${encodeURIComponent(u.username)}`), `Removed ${u.username}`);
      };
      tbody.appendChild(tr);

      if (editing === u.username) {
        const edit = el(`<table><tbody><tr class="user-edit"><td colspan="4">
          <p class="hint">Projects <strong>${esc(u.username)}</strong> can see:</p></td></tr></tbody></table>`).querySelector('tr');
        const cell = edit.querySelector('td');
        const p = projectPicker(u.projects);
        cell.appendChild(p);
        const save = el('<div class="user-edit-actions"><button type="button" class="btn btn-primary">Save projects</button> <button type="button" class="btn btn-quiet">Cancel</button></div>');
        save.children[0].onclick = () => run(async () => {
          await api('PUT', `/api/users/${encodeURIComponent(u.username)}`, { projects: p.value() });
          editing = null;
        }, `Projects updated for ${u.username}`);
        save.children[1].onclick = () => { editing = null; render(); };
        cell.appendChild(save);
        tbody.appendChild(edit);
      }
    });
    host.appendChild(table);
  }
  load();
}

  tab.mount(stage);
