// ---------------------------------------------------------------- refresh button
/* Talks to refresh_server.py on localhost so the dashboard can pull fresh
   SiteSense data on demand instead of waiting for the scheduled run. That
   helper is a separate always-on process (see the "RSGx PMO Dashboard
   Refresh Server" scheduled task); if it is not running, the calls below
   simply fail to connect and the button says so, rather than doing nothing
   silently. On the hosted artifact link this will always fail to connect,
   because the viewer's browser has no route to someone else's PC - that is
   expected, not a bug.

   Opened straight off disk (file://, the local workflow via refresh_server.py)
   there is no same-origin server to ask, so this targets that fixed local
   port. Served over http(s) instead - the Railway deployment, or any future
   local dev server - the page and the API live at the same origin, so a
   relative path is both correct and portable across whatever host/port that
   turns out to be. */
const REFRESH_BASE = location.protocol === 'file:' ? 'http://127.0.0.1:8799' : '';
const REFRESH_POLL_MS = 3000;
let refreshPollTimer = null;

function setRefreshStatus(mode, html) {
  const box = document.getElementById('refreshStatus');
  box.className = 'refresh-status' + (mode ? ' is-' + mode : '');
  box.innerHTML = html || '';
}

function refreshElapsed(startedAt) {
  const s = Math.max(0, Math.round(Date.now() / 1000 - startedAt));
  return s < 60 ? `${s}s` : `${Math.floor(s / 60)}m ${s % 60}s`;
}

async function pollRefreshStatus() {
  const btn = document.getElementById('refreshBtn');
  clearTimeout(refreshPollTimer);
  let st;
  try {
    const res = await fetch(REFRESH_BASE + '/status');
    st = await res.json();
  } catch (err) {
    btn.disabled = false;
    setRefreshStatus('error', '<span class="dot dot-alert"></span>Lost contact with the refresh helper');
    return;
  }
  if (st.phase === 'running') {
    btn.disabled = true;
    setRefreshStatus('running', `<span class="dot dot-warn"></span>Refreshing... ${refreshElapsed(st.startedAt)}`);
    refreshPollTimer = setTimeout(pollRefreshStatus, REFRESH_POLL_MS);
  } else if (st.phase === 'done') {
    setRefreshStatus('done', '<span class="dot dot-ok"></span>Refreshed. Reloading...');
    setTimeout(() => location.reload(), 900);
  } else if (st.phase === 'error') {
    btn.disabled = false;
    const lastLine = (st.tail && st.tail.length) ? esc(st.tail[st.tail.length - 1]) : '';
    setRefreshStatus('error', `<span class="dot dot-alert"></span>Refresh failed${lastLine ? ': ' + lastLine : ''}`);
    console.error('fetch_data.py failed. Full output:', (st.tail || []).join('\n'));
  } else {
    btn.disabled = false;
    setRefreshStatus('', '');
  }
}

async function startRefresh() {
  const btn = document.getElementById('refreshBtn');
  btn.disabled = true;
  setRefreshStatus('running', '<span class="dot dot-warn"></span>Starting...');
  if (SERVER) {
    try { await api('POST', '/refresh'); pollRefreshStatus(); }
    catch (err) {
      btn.disabled = false;
      setRefreshStatus('error', `<span class="dot dot-alert"></span>${esc(err.message)}`);
    }
    return;
  }
  try {
    // No custom headers here: refresh_server.py's CORS preflight only allows Content-Type.
    const res = await fetch(REFRESH_BASE + '/refresh', { method: 'POST' });
    await res.json();
    pollRefreshStatus();
  } catch (err) {
    btn.disabled = false;
    setRefreshStatus('error',
      '<span class="dot dot-alert"></span>Can\'t reach the refresh helper on this PC. '
      + 'It may not be running, or this page is open on someone else\'s machine.');
  }
}

function initRefreshButton() {
  const btn = document.getElementById('refreshBtn');
  // Refreshing hits the SiteSense API for every project, so on the server it is
  // an admin action; viewers still get fresh data from the daily schedule.
  if (!IS_ADMIN) { btn.hidden = true; return; }
  btn.addEventListener('click', startRefresh);
  // Silent probe: if a refresh was already under way before this page loaded
  // (the tab was reloaded mid-run), resume tracking it. Say nothing if the
  // helper simply is not running yet - that is the ordinary idle state.
  fetch(REFRESH_BASE + '/status').then(res => res.json()).then(st => {
    if (st.phase === 'running') pollRefreshStatus();
  }).catch(() => { /* not running; stay quiet until the user clicks */ });
}

function boot() {
  const gen = new Date(D.generated_at);
  document.getElementById('stamp').textContent =
    `Data pulled ${gen.toLocaleString('en-AU', {dateStyle: 'medium', timeStyle: 'short'})} `
    + `· ${PROJ.length} project${PROJ.length === 1 ? '' : 's'} · ${nf(D.materials.length)} materials`;

  const tabsEl = document.getElementById('tabstrip');
  TABS.forEach(t => {
    const b = el(`<button role="tab" data-id="${t.id}" aria-selected="false"${t.config ? ' data-config="true"' : ''}>${esc(t.title)}</button>`);
    b.onclick = () => openTab(t.id);
    tabsEl.appendChild(b);
  });

  const wanted = location.hash.replace('#', '');
  openTab(TABS.some(t => t.id === wanted) ? wanted : TABS[0].id);
}

// ---------------------------------------------------------------- signed-in user (server only)
function initUserBox() {
  if (!SERVER) return;
  const box = document.getElementById('userBox');
  box.hidden = false;
  box.innerHTML = `<span class="user-name" title="Signed in">${esc(SERVER.username)}
      <span class="user-role">${SERVER.role === 'admin' ? 'Admin' : 'Viewer'}</span></span>
    <button type="button" class="btn btn-quiet" id="pwOpen">Change password</button>
    <form method="post" action="/logout"><button type="submit" class="btn btn-quiet">Sign out</button></form>`;

  const dlg = document.getElementById('pwDialog');
  const errBox = document.getElementById('pwError');
  document.getElementById('pwOpen').onclick = () => {
    document.getElementById('pwForm').reset(); errBox.textContent = ''; dlg.showModal();
  };
  document.getElementById('pwCancel').onclick = () => dlg.close();
  document.getElementById('pwForm').onsubmit = async e => {
    e.preventDefault();
    const current = document.getElementById('pwCurrent').value;
    const next = document.getElementById('pwNew').value;
    if (next !== document.getElementById('pwConfirm').value) { errBox.textContent = 'The new passwords don\'t match.'; return; }
    try {
      await api('POST', '/api/password', { current, new: next });
      dlg.close(); toast('Password changed', 'ok');
    } catch (err) { errBox.textContent = err.message; }
  };
}

boot();
initRefreshButton();
initUserBox();
